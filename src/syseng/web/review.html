<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Spec review</title>
<style>/*CSS*/</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><h1>Spec review</h1><span class="repo" id="repo"></span></div>
    <span class="spacer"></span>
    <div class="meta"><span class="mono" id="when"></span><label class="person" id="person"></label>
      <button class="iconbtn" id="theme" type="button" aria-label="Switch light and dark"></button></div>
  </div>
  <nav class="sections" id="nav" aria-label="Sections"></nav>
</header>
<div class="layout">
  <div class="pane-main">
    <main id="main"></main>
    <footer class="small muted foot">Generated by <code>spec review</code>. Copy your feedback and paste it to your agent, which applies it with <code>spec feedback apply</code>, or post it on the pull request as your review.</footer>
  </div>
  <aside class="side" id="side" aria-label="The system">
    <div class="side-head"><b>The system</b><span class="grow"></span>
      <button class="iconbtn" id="side-close" type="button" aria-label="Close the system pane">&times;</button></div>
    <div class="focus" id="focus"></div>
    <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize the item in focus" tabindex="0"></div>
    <div class="graphbox" id="graphbox"></div>
  </aside>
</div>
<script type="application/json" id="review-data">/*DATA*/</script>
<script>/*JS*/</script>
</body>
</html>
