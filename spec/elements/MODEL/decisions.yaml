- id: DR-55
  title: Intent records summarize what a person said, with author and context, and never quote it
  decided_by: engineer
  elements:
  - MODEL
  - CHECK
  - REVIEW
  - AGENT
  requirements: SYS-35, MODEL-34, MODEL-36, MODEL-37, CHECK-20, REVIEW-17, AGENT-53, AGENT-54
  recorded: round 18
  context: Items kept the engineer's words verbatim, in quotes lists (DR-46) and in older source fields, and approval records kept their words too. The engineer doesn't want unreviewed conversation committed word for word to a public repository, but does want a reader to see how far a person specified something and what they left open.
  decision: |-
    Each item takes an intent list. Each record holds:
    - **by:** the person's name and email address (DR-56);
    - **when:** the date and time of the statement;
    - **context:** the agent's account of what was being discussed and what prompted the statement;
    - **said:** a close summary of what the person said, lightly cleaned up and in the third person. It keeps their hedges and strength, such as probably or must, adds no number or mechanism they didn't give, and says what they left open when they said so;
    - **basis:** stated or guided (DR-54);
    - a fingerprint of the item as it was, filled in by the CLI.

    Quotation marks aren't allowed in these fields. Lock records and change-log reasons summarize in the same way. The migration summarizes the existing verbatim text (DR-61).
  alternatives: Keeping the verbatim words (DR-46), which publishes conversation. Keeping verbatim words outside the repository with a summary inside, which needs storage every machine and person shares.
  consequences: A summary is the agent's reading, so its fidelity is checked by auditors and by the person on the review page, not by the checker. Version-control history still holds the verbatim text committed before the migration. Removing it means rewriting history, which is the engineer's call.
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-21'
    context: Revising round 12's choice to keep the engineer's words verbatim (DR-46), while planning round 18's levels of intent and review page.
    said: Likes that the reasoning behind decisions is recorded, but is concerned about committing unreviewed verbatim quotes to a public repository. Wants instead a summary close to what was said, lightly cleaned up, with its author and the context of the discussion, so a reader can tell how far the person specified something and what they left unspecified, keeping the conversation separate from what is published.
    basis: stated
    fingerprint: bf89efae2cf4
- id: DR-64
  title: Intent records and locks are validated against pydantic schemas
  decided_by: agent
  elements:
  - MODEL
  - CHECK
  - CLI
  requirements: MODEL-34, MODEL-36, MODEL-37, CHECK-20
  recorded: round 20
  context: The engineer's words had lived in free text, and intent records and locks were checked field by field in hand-written code. The engineer suggested schemas.
  decision: |-
    - Intent records (a draft as an agent writes it, and the stored record) and locks are pydantic models with fixed fields and no others.
    - Formats are validated: a person is `Name <email>`, a statement's time is a date with the time when known, a lock's time is an ISO date and time, a fingerprint is twelve hex characters, the basis and the channel come from fixed lists.
    - The checker turns each validation error into a finding (A006, A010), so a malformed record is reported with everything else in one run; `spec edit` refuses a malformed draft before writing.
    - Items themselves stay plain mappings for now; moving every kind of item to a schema is a larger change for a later round.
  alternatives: Hand-written field checks, which drift from the format and don't check values. JSON Schema, which needs a second file to keep in step with the code.
  consequences: The toolkit depends on pydantic as well as PyYAML. Free-text summaries inside other fields are no longer an accepted way to record a person's words.
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-21'
    context: Reviewing a transitional source field written in round 18, in which the author, date and summary sat in one free-text string, while round 20's migration was under way.
    said: Suggested using pydantic to enforce the metadata and validate it, and found one free-text field carrying a summary, author and date brittle; it should be several metadata fields. Left the implementation to the agent, wanting only to nudge it toward best practice.
    basis: guided
    fingerprint: 844ef68db123
