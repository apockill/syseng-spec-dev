- id: MODEL-V1
  verifies:
  - MODEL-1
  method: test
  technique: unit test
  description: Given a system element directory nested inside another element's directory, the checker reports it.
  tests:
    python:
    - tests/test_check_structure.py::test_nested_element_directory_is_reported
- id: MODEL-V2
  verifies:
  - MODEL-2
  - MODEL-11
  method: test
  technique: unit test
  description: Given an element whose parent doesn't exist, or parents that loop back on themselves, the checker reports a broken tree.
  tests:
    python:
    - tests/test_check_structure.py::test_broken_tree_is_reported
    - tests/test_check_structure.py::test_parent_loop_is_reported
- id: MODEL-V3
  verifies:
  - MODEL-3
  - MODEL-4
  method: test
  technique: unit test
  description: Given a dependency on an unknown element, or a dependency cycle, the checker reports it and names every element in the cycle.
  tests:
    python:
    - tests/test_check_structure.py::test_unknown_dependency_is_reported
    - tests/test_check_structure.py::test_dependency_cycle_is_reported
- id: MODEL-V4
  verifies:
  - MODEL-12
  method: test
  technique: unit test
  description: Given a need that no requirement serves, the checker reports the need.
  tests:
    python:
    - tests/test_check_structure.py::test_unserved_need_is_reported
- id: MODEL-V5
  verifies:
  - MODEL-13
  method: test
  technique: unit test
  description: Given a requirement with neither a rationale nor intent, the checker reports it.
  tests:
    python:
    - tests/test_check_structure.py::test_requirement_without_rationale_is_reported
- id: MODEL-V6
  verifies:
  - MODEL-38
  method: test
  technique: unit test
  description: An item whose origin is neither the engineer nor an agent is reported, and so is an item with no intent, no lock and no basis.
  tests:
    python:
    - tests/test_check_structure.py::test_missing_origin_is_reported
    - tests/test_check_structure.py::test_an_item_with_no_intent_and_no_basis_is_reported
- id: MODEL-V7
  verifies:
  - MODEL-15
  method: test
  technique: unit test
  description: Given an item that reuses a retired ID, or two items sharing one ID, the checker reports each.
  tests:
    python:
    - tests/test_check_structure.py::test_retired_id_reuse_is_reported
    - tests/test_check_structure.py::test_duplicate_id_is_reported
    - tests/test_edit.py::test_remove_retires_the_id_and_drops_its_approval
    - tests/test_edit.py::test_add_allocates_the_next_unused_id
- id: MODEL-V8
  verifies:
  - MODEL-16
  method: test
  technique: unit test
  description: Each wording rule fires on a sentence that breaks it, and none fires on well-formed requirements, including the calibrated exemptions (a quoted 'shall', 'how many', proper names, 'both … and').
  tests:
    python:
    - tests/test_wording.py::test_good_requirements_pass
    - tests/test_wording.py::test_each_rule_fires
    - tests/test_wording.py::test_quoted_shall_is_a_mention_not_an_obligation
    - tests/test_wording.py::test_capitalized_vague_word_at_sentence_start_still_counts
- id: MODEL-V9
  verifies:
  - MODEL-17
  method: test
  technique: unit test
  description: Requirement text containing a code span, a file name, a snake_case or camelCase identifier, or call syntax is reported.
  tests:
    python:
    - tests/test_wording.py::test_each_rule_fires
- id: MODEL-V10
  verifies:
  - MODEL-24
  - MODEL-25
  - MODEL-31
  method: test
  technique: unit test
  description: A lock records the item's fingerprint. Rewording the item makes the lock no longer match it; re-pointing its test links does not.
  tests:
    python:
    - tests/test_approvals.py::test_rewording_unapproves_but_relinking_does_not
    - tests/test_approvals.py::test_approve_command_records_fingerprint_and_words
- id: MODEL-V11
  verifies:
  - MODEL-30
  method: test
  technique: unit test
  description: A verification item whose method isn't test, analysis, demonstration or inspection, or whose technique is unknown, is reported.
  tests:
    python:
    - tests/test_check_structure.py::test_invalid_verification_item_is_reported
- id: MODEL-V12
  verifies:
  - MODEL-34
  - MODEL-35
  - CLI-11
  - SYS-43
  method: test
  technique: unit test
  description: Locking two items together, then one of them again, keeps both locks of it, oldest first, each with the person, the channel, the date and time, and the batch size. A lock needs no words. The person recorded comes from the toolkit's own setting first, then the environment, then version control's user name and email address.
  tests:
    python:
    - tests/test_review.py::test_every_approval_is_kept_with_who_and_how
    - tests/test_levels.py::test_an_approval_needs_no_words
    - tests/test_levels.py::test_the_person_comes_from_the_toolkit_setting_first
- id: MODEL-V13
  verifies:
  - MODEL-37
  - MODEL-38
  method: test
  technique: unit test
  description: An edit refuses an intent record without a basis of stated or guided. A record with the basis guided makes the item guided. An item with the basis added is added, and what derives from it counts as added too. A basis other than derived or added is reported.
  tests:
    python:
    - tests/test_levels.py::test_an_edit_refuses_an_intent_record_without_a_basis
    - tests/test_levels.py::test_the_highest_level_applies
    - tests/test_levels.py::test_an_added_item_and_what_derives_from_it_count_as_added
    - tests/test_levels.py::test_an_invalid_basis_is_reported
- id: MODEL-V14
  verifies:
  - MODEL-41
  method: test
  technique: unit test
  description: An intent record defaults to a human conversation, accepts document, code comment, commit message and agent conversation sources, needs a path for a read source, and rejects unknown kinds.
  tests:
    python:
    - tests/test_levels.py::test_intent_read_from_a_source_names_it
- id: MODEL-V15
  verifies:
  - MODEL-41
  method: test
  technique: unit test
  description: An intent record read from a document keeps its source kind, path and author through spec edit, and is attributed to the source's author.
  tests:
    python:
    - tests/test_edit.py::test_intent_read_from_a_document_keeps_its_source_and_author
