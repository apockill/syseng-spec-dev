    when: '2026-10-21'
    context: Round 18, planning the review page that replaces the Markdown views.
    said: Wants everything on the review page also available to agents, so the conversation flows freely while they ask questions and request changes, and, since the page has a readable diff view, spec diff commands that let agents read differences in a form that suits them.
    basis: guided
    fingerprint: f676f637edd5
