- id: ONBOARD-7
  text: Onboarding shall record each failing test or broken link it finds as an open decision, without fixing it.
  traces_to: SYS-23
  why: this follows from ONBOARD-2. Fixing things during onboarding would be steering you didn't ask for.
  basis: derived
- id: ONBOARD-8
  text: During onboarding, the agent shall establish whether the repository publishes its directories or pushes its commits, raise each way the spec would be exposed as the first open decision on the review page, and keep the spec unpublished until the engineer answers.
  traces_to: SYS-23
  basis: added
  why: in the trial, the spec would have been served as a website and pushed by a commit hook, with the engineer's email and security findings in it.
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: 2026-10-26 08:08
    context: Reviewing the overnight plan for the migration the engineer will keep, which asked the engineer to be reachable for a preflight.
    said: Sees this as a post-flight step; once the digging and speccing is done, the agent hands over the review page as normal, taking special care that the items it highlights for approval come highest value first.
    basis: stated
    fingerprint: ac2a2c92bcd4
- id: ONBOARD-9
  text: Onboarding shall write one requirement per behaviour that a user, an operator or another element relies on, keeping constants the engineer didn't state in verification items or decision records.
  traces_to: SYS-23
  basis: added
  why: the trial's three agents wrote between 226 and 445 requirements for the same code, about two in five with constants in them.
- id: ONBOARD-10
  text: Where the code only partly meets what the project intends, onboarding shall keep the requirement as intended and raise an open decision.
  traces_to: SYS-23
  basis: added
  why: in the trial, agents sometimes reworded requirements to match the code, once weakening a safety rule.
- id: ONBOARD-11
  text: Onboarding shall count as verified only the verification items whose tests or checks have run.
  traces_to: SYS-23
  basis: added
  why: one trial agent reported full coverage while 93 of its verification items had never run.
