- id: ONBOARD-1
  text: When onboarding an existing project, the toolkit shall extract its needs, requirements, verification items and decision records from the project's code, tests, comments and documentation.
  traces_to: SYS-23
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-11'
    context: |-
      Date approximate (rounds 1 to 11). Round 5: reviewing SYS-23, how an existing project is brought into the toolkit.
    said: Said that for an existing project the agent simply needs to guess, extract and format the spec from the project, clarifying certain design decisions so as to extract the needs, requirements and verification items.
    basis: stated
    fingerprint: a5e56970a6cb
