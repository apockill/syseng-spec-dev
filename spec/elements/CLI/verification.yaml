- id: CLI-V5
  verifies:
  - CLI-9
  - SYS-5
  method: test
  technique: integration test
  origin: agent
  description: Setting up an empty repository writes a spec that the checker passes with no errors, the launcher, the skill with the launcher's name filled in, and the Claude Code hooks and subagents. The launcher then runs the checker from the repository, and on a machine without the toolkit it says so and exits with code 127. Setting up for Antigravity writes the skill and no Claude Code files. An existing spec is left as it was.
  tests:
    python:
    - tests/test_init.py::test_init_sets_up_an_empty_repository
    - tests/test_init.py::test_launcher_runs_the_toolkit_from_the_repository
    - tests/test_init.py::test_launcher_explains_a_machine_without_the_toolkit
    - tests/test_init.py::test_antigravity_gets_the_skill_without_claude_code_glue
    - tests/test_init.py::test_existing_spec_is_left_alone
- id: CLI-V6
  verifies:
  - CLI-10
  method: test
  technique: integration test
  origin: agent
  description: A second setup reports every file unchanged, and a setup run without naming harnesses refreshes every harness already set up. Settings and hooks that setup didn't write survive two runs, and setup's own hooks appear once. Unreadable settings stop setup without being overwritten. A skill page the skill no longer has is removed. The drift check reports an edited installed file and writes nothing. This machine's launcher is kept unless a new one is named.
  tests:
    python:
    - tests/test_init.py::test_init_again_changes_nothing
    - tests/test_init.py::test_a_plain_rerun_refreshes_every_installed_harness
    - tests/test_init.py::test_init_keeps_other_settings_and_hooks
    - tests/test_init.py::test_init_refuses_unreadable_settings
    - tests/test_init.py::test_init_removes_skill_files_the_skill_no_longer_has
    - tests/test_init.py::test_check_reports_installed_files_that_drifted
    - tests/test_init.py::test_machine_launcher_is_kept_unless_replaced
