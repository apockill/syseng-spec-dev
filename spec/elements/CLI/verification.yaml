- id: CLI-V10
  verifies:
  - CLI-16
  - CLI-20
  method: test
  technique: integration test
  origin: agent
  description: Setup appends the section to an existing instruction file, keeps the rest of the file, and changes nothing when run again. It leaves a CLAUDE.md that includes AGENTS.md alone, and with instructions turned off it writes no instruction file. It allows the everyday commands without allowing approve or resolve, and lists each rule once.
