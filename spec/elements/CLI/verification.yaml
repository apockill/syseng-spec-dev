- id: CLI-V11
  verifies:
  - CLI-17
  - CLI-18
  - CLI-19
  method: test
  technique: integration test
  origin: agent
  description: An edit that needs acknowledgments says how to retry it, a retry with only acknowledgments applies it, and a retry with nothing left to retry says so. The status command shows the open change, the request, the alteration awaiting the engineer with its line, and the check summary. An edit's context shows a two-line value as two lines.
  tests:
    python:
    - tests/test_agent_experience.py::test_a_batch_can_be_retried_with_acknowledgments_alone
    - tests/test_agent_experience.py::test_status_says_what_is_open_and_what_awaits_the_engineer
    - tests/test_agent_experience.py::test_edit_context_keeps_the_lines_of_multi_line_text
