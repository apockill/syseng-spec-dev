- id: CLI-1
  text: The toolkit shall provide one command-line tool through which agents query, edit, check, verify and render the spec.
  origin: engineer
  traces_to: SYS-27
  source: |-
    "The commandline interface the LLM uses" · "I want the CLI to be the main way agents edit the spec." · "Can't the CLI be the implementation?"
- id: CLI-2
  text: The CLI shall generate, for a named implementation, a to-do list of the requirements and verification items not yet implemented or not passing in it.
  origin: engineer
  traces_to: SYS-9
  source: |-
    "This ends up forming an automated 'todo' list for the LLM … 'let's implement this project in rust' and the todo list can be regenerated but for an entire different implementation"
- id: CLI-5
  text: |-
    Before applying an edit, the CLI shall show the agent the edit's context: affected parent and child requirements, linked verification items and tests, dependent system elements, and approval status.
  origin: engineer
  traces_to: SYS-20
  source: |-
    "if an agent wants to edit the spec, the CLI has a chance to intercept the request and give extra context (for example, dumping the descendant V&V / REQs into context, then asking 'confirm?' or something)"
- id: CLI-3
  text: |-
    The CLI shall answer four queries: one system element's spec, the system elements related to given files, the trace from a requirement to its verification items and tests, and a requirement's history (its rationale, each change with its reason, and its linked context).
  origin: agent
  traces_to: SYS-20
  why: lets an agent pull exactly the spec it needs into context, instead of all of it.
- id: CLI-4
  text: The CLI shall order a to-do list with each system element's items after those of the system elements it depends on.
  origin: agent
  traces_to: SYS-9
  why: lets an agent build from the bottom up. A port starts at the leaves.
- id: CLI-6
  text: When an edit affects approved items or items that others depend on, the CLI shall apply it only after the agent acknowledges each affected item by name.
  origin: agent
  traces_to: SYS-20
  refines: |-
    "then asking 'confirm?'"
  why: a model will rubber-stamp a generic "confirm?". Naming each affected item makes it actually consider each one. See DR-19.
- id: CLI-7
  text: The CLI shall accept multiple edits in a single invocation.
  origin: agent
  traces_to: SYS-25
  why: a twenty-requirement update should be one call, not twenty. The input format is DR-2.
- id: CLI-8
  text: The CLI shall reject a modification or removal that has no reason.
  origin: agent
  traces_to: SYS-19
  why: this enforces CHANGE-5 at write time, while the reason is fresh.
- id: CLI-9
  text: The CLI shall set up a repository in one command, writing the spec skeleton where none exists, the skill, and the hooks and subagents for each harness the engineer names.
  traces_to: SYS-5
  origin: agent
  why: SYS-5 asks for one-step setup. The launcher gives agents one command that works on every machine (DR-39). The skill and the harness glue are what make an agent follow the method (DR-38, DR-40).
- id: CLI-10
  text: When setup runs again, the CLI shall refresh the files it wrote and leave every other file and setting unchanged.
  traces_to: SYS-5
  origin: agent
  why: running setup again is how a repository picks up a newer skill or hook, and it must never overwrite the engineer's own settings, such as their other Claude Code hooks.
- id: CLI-11
  text: When no approver is named, the CLI shall record as approver the user name configured for the repository's version control.
  traces_to: SYS-33
  origin: agent
  why: who approved is part of SYS-33, and the version-control user name is one the engineer has already set.
- id: CLI-12
  text: When recording an approval, the CLI shall record each resolved decision that involved the item.
  traces_to: SYS-33
  origin: engineer
  quotes:
  - said: 2026-10-17 20:01
    words: Approved over llm after many questions (which would be recorded as part of rationale in the ticket, indicating higher signal) is useful.
    context: Discussing which kinds of approval carry more signal.
- id: CLI-13
  text: Before applying an edit, and when showing an item, the CLI shall show the item's review state, its approvals with their channels, whether it carries the engineer's words or decision, its last edit and number of edits, the discussions that involved it, and how many items link to it.
  traces_to: SYS-39
  origin: engineer
  quotes:
  - said: 2026-10-17 22:12
    words: |-
      I think whats better reflective of what I'm trying to say is 'metrics that can represent importance are surfaced to the llm in interfaces where it would be useful (last edit, # of discussion, approval types, # of context links, etc...) but not "IMPORTANT" or "NOT IMPORTANT" classification or scoring.
    context: Approving SYS-40, which rules out a stored importance score.
- id: CLI-14
  text: The CLI shall record in the open change an agent's proposal that the engineer approve items, with the agent's reason.
  traces_to: SYS-38
  origin: agent
  why: SYS-38 needs the proposals kept somewhere the engineer reviews, and the change record is that place.
- id: CLI-15
  text: Every message and generated view shall name the toolkit's command in the form that runs it in the repository at hand.
  traces_to: SYS-25
  origin: agent
  why: agents type what messages tell them. With the toolkit on the PATH, that is `spec` in every repository, and no message may name another form.
- id: CLI-16
  text: Setup shall add to the host repository's instruction file a section, between markers, that tells every session to follow the skill.
  traces_to: SYS-5
  origin: agent
  why: a session only loads the skill when something tells it to, and the instruction file is what every harness reads at the start.
- id: CLI-17
  text: When an edit needs acknowledgments or has errors, the CLI shall accept the same edit again with only the acknowledgments added.
  traces_to: SYS-25
  origin: agent
  why: sending a large batch again just to add acknowledgments costs tokens and invites copying mistakes.
- id: CLI-18
  text: The CLI shall summarize in one command the open change, its open decisions, the alterations and proposals awaiting the engineer, and the check's result.
  traces_to: SYS-14
  origin: agent
  why: an agent starting work, or an engineer catching up, otherwise has to piece this together from four commands.
- id: CLI-19
  text: An edit's context shall show multi-line text with its lines intact.
  traces_to: SYS-30
  origin: agent
  why: decision records use bullet lists, and flattening them into one line makes them unreadable.
- id: CLI-20
  text: For harnesses with permission rules, setup shall let agents run the toolkit's commands without asking, except the commands that record the engineer's words.
  traces_to: SYS-5
  origin: agent
  why: without the rules every check and edit waits for a click. Approving and resolving record the engineer's words, so the engineer sees and confirms each of those.
