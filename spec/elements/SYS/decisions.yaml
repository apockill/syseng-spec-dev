- id: DR-61
  title: Change meaning first, then migrate structure, intent and vocabulary in one pass
  decided_by: engineer
  elements:
  - SYS
  - MODEL
  - CHECK
  - AGENT
  requirements: SYS-35, SYS-42, SYS-50
  recorded: round 18
  context: The engineer asked for a migration away from the approval vocabulary, either first or as part of the flow-down migration.
  decision: |-
    - This round changes meaning only.
    - Phase 1 builds the tooling, including the CLI's refusal (CLI-22), reading old and new fields side by side. Until the migration, old fields map to levels: an approval is a lock; an engineer origin, a source or quotes field, or a decision the engineer made, is stated intent; an agent origin is derived.
    - Phase 2 migrates this repository element by element, touching each item once: re-trace it for flow-down, summarize its verbatim words into intent records with person and basis, turn its approvals into explicit locks, retire the origin field and the derived mark, and rename the approval vocabulary to locks and the engineer to a person where several people apply. Its rewordings are declared as rewordings. The old fields and commands then go, and the checker rejects them.
    - Phases 3 to 5 build the comparison, the review page and the feedback loop.
  alternatives: A separate migration per concern, which touches each item two or three times and asks for a review each time.
  consequences: Until Phase 2 the spec mixes vocabularies, and this round's statements sit as summaries in the old source field.
