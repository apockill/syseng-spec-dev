- id: DR-44
  title: Locking works like delegated authority in configuration management
  decided_by: agent
  elements:
  - SYS
  - MODEL
  - CHANGE
  - AGENT
  requirements: SYS-33, SYS-34, SYS-35, SYS-36, SYS-37, SYS-38, SYS-39, SYS-40
  recorded: round 12 (spec-first)
  status: built in round 12. Extended in round 18 by DR-54, whose five levels of intent replace its two states.
  context: The engineer wants to lock the key points of the requirement tree, let agents decide the rest, and have each later change to what they locked, wrote or decided brought back to them (NEED-14 to NEED-20). Back then every item needed approval, and over 200 items were waiting.
  decision: |-
    Locking follows the split configuration management makes between a customer and a contractor (MIL-HDBK-61A, for example).
    - The engineer locks key items explicitly, as a customer approves a baseline. Everything beneath a locked item is delegated: the agent decides it, as a contractor decides the detailed design.
    - A change that alters an item the engineer locked, wrote or decided is like a Class I change: it goes back to the engineer once built and tested (SYS-37). Any other change is like a Class II change: the agent decides, and the change record logs it.
    - Whether an item is locked, delegated or neither is computed from the locks and the tree each time it's shown, and never stored (SYS-40).
    - Where a requirement sits and what the engineer said that it expresses are separate, as INCOSE keeps "trace to parent" apart from "trace to source": the system's structure places it (SYS-36), and its intent records carry what the engineer said (SYS-35).
  alternatives: Locking every item, which was the rule then and doesn't scale. A stored importance score, which the engineer ruled out.
  consequences: The engineer locks a few key items per change instead of every item. Agents need each item's lock state at the moment they change it (SYS-39). The merge check never blocks; it lists the alterations the engineer hasn't answered yet (CHECK-15, round 12 D1).
  basis: derived
- id: DR-54
  title: Five levels of intent, computed from locks, intent records and a recorded basis
  decided_by: engineer
  elements:
  - SYS
  - MODEL
  - CHECK
  - REVIEW
  - AGENT
  requirements: SYS-42, SYS-34, MODEL-37, MODEL-38, MODEL-40, CHECK-18, CHECK-24, AGENT-60
  recorded: round 18
  context: Approval gave items two states that matter, approved or delegated, and an item the engineer stated in conversation showed as unreviewed unless they approved it by ID. The engineer wants agents to build fast while recording how directly a person asked for each item, using agent judgment, with anything they say they want locked at some level.
  decision: |-
    Five levels, highest first:
    - **explicit:** a person locked it by name, on the review page, in chat or in the terminal. A lock record, which is what an approval record was before round 18.
    - **stated:** a person asked for this item. An intent record with the basis stated.
    - **guided:** a person shaped it without asking for it, for example by choosing an option, reacting to a demo, or giving a constraint it follows from. An intent record with the basis guided.
    - **derived:** something above it needs it, and no person addressed it. The basis derived.
    - **added:** an agent's own idea, which nothing a person asked for needs. The basis added.

    An item takes its highest level. An explicit, stated or guided item shows as changed once its content differs from what its lock or intent record was given for. Levels are computed each time and never stored. Choosing stated or guided, and derived or added, is the agent's judgment when it records the item, and the review page shows each one for correction.

    The basis records how an item came about, not how much it matters, so SYS-40 holds: agents still weigh dates, edit counts and discussions for themselves.

    What each level means for a later change: a conflict with an explicit or stated item is raised before building (DR-57); an alteration to a guided item is asked about once built (SYS-37); derived and added items are changed freely, and the change is logged.
  alternatives: Two states, approved and delegated (DR-44 alone), which can't tell what a request needed from what an agent added. A stored level field, which says nothing about who or when. A numeric score, which the engineer ruled out (SYS-40).
  consequences: |-
    Every requirement and decision record carries a basis, an intent record or a lock; for this repository the migration supplies them (DR-61). Verification items and element definitions count as derived unless a person said or locked something about them (MODEL-40). A derived item under an added item counts as added.
    - A lock or intent record keeps its level after the item changes, until a person answers the change; changed is judged against the newest record (CHECK-24).
    - Keeping an alteration re-records the item at its earlier level; it becomes explicit only if the person locks it.
    - DR-44's delegation remains, as the item a derived or added item names above it (SYS-34).
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-21'
    context: Round 18. Settling how to record how directly a person asked for each item; the agent proposed five levels.
    said: |-
      Wants agent judgment, with anything they say they want locked at some level: explicit, in conversation, or lower, with derived the lowest. Agreed to the five levels as proposed: explicit, stated, guided, derived and added.
    basis: guided
    fingerprint: 023ffa8b8424
