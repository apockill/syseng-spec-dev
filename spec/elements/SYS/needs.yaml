- id: NEED-6
  text: The engineer needs to choose, per change, between specifying first and building first.
  context: |-
    there are two scenarios.
    - **Planning:** you ask for the spec of a feature, review it and lock it. Agents then implement it from a to-do list and report anything they had to change. The same to-do list can drive a rebuild in a new language.
    - **Building:** you ask for a change to be built and try the result. The agent updates the spec during or after the work, whichever suits it, and you review the spec changes once the change is done.
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-11'
    context: |-
      Date approximate (rounds 1 to 11). Describing two ways of working: asking for a feature's spec and reviewing it before it is built, or asking for a change to be built and reviewing the spec afterwards.
    said: Said the system should support both of these critical user journeys, and support both workflows cleanly.
    basis: stated
    fingerprint: 6ce64f8ee788
