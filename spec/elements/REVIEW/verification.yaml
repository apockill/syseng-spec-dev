  - SYS-34
  - REVIEW-17
  method: test
  technique: unit test
  description: The page shows a locked item that changed since as explicit and changed, an agent's item as derived under the stated item above it, and an added item as added; it shows each intent record with its person, its date and time and its context.
  tests:
    python:
    - tests/test_render.py::test_the_page_marks_each_items_level_and_what_its_under
    - tests/test_render.py::test_intent_reaches_the_page_with_who_when_and_context
