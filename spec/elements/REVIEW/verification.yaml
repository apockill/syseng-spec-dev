- id: REVIEW-V34
  verifies:
  - REVIEW-58
  method: test
  technique: unit test
  description: Every decision's and comment's anchor, and every shorter form the page takes, is made only of letters, digits, '.', '_', '~' and '-', and a focus link joins anchors with '~'. A round only one change has gives a short form, a round two changes share gives none, and a bare D<n> lists every candidate until no other change has that decision open, when it is the newest change's. Run under Node where Node is installed, the page's own functions read '#ID', '#focus~A~B', '#focus=A,B', '?focus=A,B' and '#A~B', the fragment winning over the query, and resolve an item ID in either case, a decision by its full or round form, a bare D<n> or F<n> naming one thing, both candidates of an ambiguous D1, and nothing for a shared round or an unknown ID.
  tests:
    python:
    - tests/test_links.py::test_every_link_form_is_made_of_characters_that_reach_the_fragment
    - tests/test_links.py::test_short_forms_name_one_thing_or_list_every_candidate
