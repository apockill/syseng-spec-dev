- id: REVIEW-V1
  verifies:
  - REVIEW-1
  - REVIEW-14
  method: test
  technique: unit test
  description: The review page's sections come in order, what awaits the person first; its graph lists the system before its parts and needs before system requirements; each item carries what it traces to, which the page inverts to show what refines it.
  tests:
    python:
    - tests/test_render.py::test_the_page_reads_top_down
    - tests/test_render.py::test_the_page_knows_what_refines_each_item
- id: REVIEW-V2
  verifies:
  - REVIEW-3
  method: test
  technique: unit test
  description: The page's graph and full spec hide verification items until the person turns them on.
  tests:
    python:
    - tests/test_render.py::test_verification_items_are_hidden_until_asked_for
- id: REVIEW-V3
  verifies:
  - REVIEW-10
  method: test
