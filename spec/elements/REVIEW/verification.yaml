  description: The page script follows a link when the page loads and on every hashchange. One item opens in the full spec, shown whatever the filters say with its details open, and is scrolled to; a decision or comment opens under For you; anything shown nowhere else, or a short form naming more than one thing, opens on its own. A focus link shows only what it names, in its order, says which names aren't on the page, lists every candidate of an ambiguous short form, and offers Show everything, which redraws the page, clears the link and returns the person to the tab and place they left. Demonstrated in round 67 in headless Chromium at 390 pixels wide, where an item link opened SYS-45 highlighted with its details below the header, and a focus link showed an item, a resolved decision, a comment and an unknown ID.
