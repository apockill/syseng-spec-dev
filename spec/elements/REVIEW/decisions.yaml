- id: DR-49
  title: Review sections carry their context inline instead of linking to it
  decided_by: agent
  elements:
  - REVIEW
  - CHANGE
  requirements: REVIEW-18, REVIEW-19
  recorded: round 13
  context: In round 12's record the engineer had to search for each proposed item's full text and scroll back. They read change records as raw Markdown in the editor, where links show no preview on hover.
  decision: |-
    Wherever the change record asks the engineer to lock or answer for an item, it repeats what's needed to judge it right there: the full text, what it sits under, its rationale and the engineer's words; for a decision record, its reasoning and the full text of the requirements it decides. The other IDs the shown text mentions are listed with their titles.
  alternatives: Linking each ID to its item with the text on hover, which only works in a Markdown preview. A glossary at the end of the record, which still means scrolling.
  consequences: Change records get longer, and the same text can appear in two sections. Each review section can be read on its own.
  basis: derived
  status: superseded in round 20 by DR-65. Change records are YAML only, read with `spec change show --full`, and from Phase 4 on the review page (DR-60).
- id: DR-60
  title: One self-contained review page replaces the Markdown views, and feedback comes back as a pasted block
  decided_by: engineer
  elements:
  - REVIEW
  - CLI
  - CHANGE
  - CHECK
  requirements: SYS-45, SYS-46, REVIEW-20, REVIEW-21, REVIEW-22, REVIEW-23, REVIEW-25, CLI-23, CLI-25, AGENT-62, CHANGE-19, CHECK-23
  recorded: round 18
  context: The engineer reviewed the spec in generated Markdown and change records, and wants a more powerful dashboard that can be iterated on, with the Markdown removed.
  decision: |-
    - One command writes a single HTML file, ignored by version control, with its data embedded and its scripts included. It loads nothing from the network.
    - Its sections follow REVIEW-20. The graph lays out the element tree with requirements nested inside, colored by level of intent.
    - Its controls lock, comment, request a change, keep or roll back an alteration, and choose an option in a decision. Unsent feedback stays in the browser.
    - Copying the feedback produces a block of text carrying the review's ID and the fingerprint of each item acted on. Pasted into the conversation, it's applied by the CLI, which records locks and choices mechanically, refuses stale ones, and records comments in the open change for the agent to answer. A block with nothing in it means reviewed, with nothing to add.
    - The requirements, decisions and change-record Markdown files are no longer generated.
  alternatives: A local server that receives feedback directly, which removes the paste step but needs a running process; it stays open as a later option. Keeping the Markdown alongside, which doubles what has to be maintained.
  consequences: Apart from the YAML, nothing in the repository reads well on a code host without running the toolkit. DR-28's generated views are superseded. The chat lock lines the prompt hook reads stay as a shortcut.
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-21'
    context: |-
      Round 18: discussing how the engineer reviews the spec, in generated Markdown views and change records, while setting out the review journey the toolkit should support.
    said: Wants the Markdown views removed in favor of a more powerful dashboard that can be iterated on. Suggested that a static page could offer a button that copies the feedback for the person to paste back to the agent.
    basis: guided
    fingerprint: fcf55fd9e7db
  status: built in round 22. The Markdown views are removed by `spec render`, which now writes the page.
- id: DR-66
  title: The review page has two panes, sections as tabs beside the system graph and the item in focus
  decided_by: agent
  elements:
  - REVIEW
  requirements: REVIEW-20, REVIEW-28, REVIEW-29, REVIEW-30
  recorded: round 23
  context: On a single long page, the graph sat below hundreds of changes, opening an item scrolled the reader away, and a decision about ten items could only be answered all at once.
  decision: |-
    - The sections become tabs, in REVIEW-20's order, opening on the first one with anything in it.
    - On a wide screen, the right pane always holds the item in focus and, below it, the system graph. Pointing at an item anywhere highlights it in the graph; clicking it opens it in the pane. On a narrow screen the pane is a drawer that opens when an item is clicked.
    - A decision lists each item it involves in full, each with its own answers (keep, or lock; roll back; suggest wording; comment), and counts how many are answered. The decision's own options stay for answering everything at once.
    - A suggested wording goes back as feedback for the agent, which applies it as the person's stated intent.
    - Items agents proposed for locking come first, apart from the mechanical list of what the most of the tree hangs from (AGENT-51).
  alternatives: Keeping one long page and moving the graph up, which still loses the reader's place. A separate graph page, which loses the link between what's being read and where it sits.
  consequences: |-
    Every section is one click away and the graph is always in sight. Answers given item by item can be sent at any time; what's left unanswered stays waiting.
    - Round 24: the first tab, For you, holds what awaits the person and then the agents' recommendations, so the high-signal part of the page is one place. The item in focus takes most of the pane by default, and a handle between it and the graph sets the split, remembered in the browser.
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: 2026-10-21 14:06
    context: Using the review page for the first time.
    said: Suggested tabs, or the graph on the right, so that hovering over or clicking an item highlights it in the graph; and a side panel for opening an item without losing their place.
    basis: guided
    fingerprint: 86783872b2e5
- id: DR-69
  title: The overview leads For you with the changes since the last review, a few health measures and the intent mix
  decided_by: agent
  basis: derived
  elements:
  - REVIEW
  requirements: REVIEW-32, SYS-47
  recorded: round 28
  context: The engineer asked for the spec's numbers up front, with degraded health called out, and without noise.
  decision: |-
    - The top of For you shows, against the person's last review: the items added, changed, removed and reworded, by kind; a row of stat tiles; and the intent mix, a bar of how the needs and requirements split across the five levels.
    - The tiles show the measures that got worse first, marked in the critical color with an icon and the word worse, then a few that matter most whatever they did. Every measure, with its value then and now, is in a table under a toggle.
    - The baseline is what the person's last page showed, from its local snapshot; without one, the spec at the revision that review was made from, or the last commit.
    - The same numbers print for agents with .
  alternatives: A separate overview tab, which the person would have to open. Every measure as a tile, which is the noise the engineer asked to avoid.
  consequences: A change that lowers verification coverage, adds checker errors or leaves locks on earlier versions is the first thing the person sees.
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: 2026-10-21 16:20
    context: The same request.
    said: Asked for the overview to be clean, without too much noise.
    basis: guided
    fingerprint: d0e6ae33bf34
- id: DR-79
  title: On the review page, colour shows the level of intent and shape shows the type of node
  decided_by: agent
  elements:
  - REVIEW
  requirements:
  - REVIEW-49
  - REVIEW-50
  context: The engineer asked for design language that tells node types apart, suggesting colours or border shapes. The page already used colour for the level of intent.
  decision: Each type has a shape, used for its dots in the graph and as a glyph beside its name on every badge. Cards repeat it with a differently styled left edge. Colour keeps meaning the level of intent, so the two never compete, and the name is always written out, so nothing relies on shape alone.
  alternatives: A colour per type, which would clash with the level colours and fail for people who can't tell colours apart.
  consequences: Readers learn one rule, shape for type and colour for level. The graph's legend says both.
  basis: derived
- id: DR-81
  title: Where the review page on the trunk takes its base from
  decided_by: agent
  elements:
  - REVIEW
  - CHANGE
  requirements:
  - REVIEW-52
  - REVIEW-53
  - CHANGE-23
  - REVIEW-41
  context: In a repository that commits straight to the trunk, the trunk's merge base with the current commit is the current commit, so the page compared the spec with itself. The fallback needs a revision to compare against.
  decision: The page treats the trunk as empty when its base equals the current revision, on the trunk or on a branch with no commits of its own. It then compares against the person's last review, from spec/reviews.yaml, else against the revision recorded when the open, or else the newest, change started, which spec change start now records in the change record as started_from. The empty trunk comparison is dropped rather than offered. The top of the page and the command's output say what it compares against in plain words (your last review at abc1234, the commit before a change started, commit abc1234, or main at abc1234), with why when the page chose it, and the command names the commit the working tree stands on.
  alternatives: A version-control operation finding the commit that added the change record, which would change the locked version-control interface (VCS-1); preferring the change's start over the last review, which hides what changed between the review and the change.
  consequences: Change records written before this have no started_from, so with no review either the page falls back to the trunk and its empty comparison, as before.
  basis: derived
- id: DR-84
  title: Links name what they open in the URL's fragment alone, with the change record's ID and a dot for decisions and comments
  decided_by: agent
  elements:
  - REVIEW
  - CLI
  requirements:
  - REVIEW-56
  - REVIEW-57
  - REVIEW-58
  - CLI-39
  basis: added
  context: |-
    The engineer usually opens the review page published as a Claude artifact. There, only a plain fragment made of letters, digits, '.', '_', '~' and '-' reaches the page's location.hash; a query string and a fragment such as #key=value never arrive. Decisions are numbered from D1 in each change and comments from F1, and are named `<change>/D<n>` elsewhere, but '/' isn't allowed. Round numbers don't name one change: this repository has two changes numbered round 66.
  decision: |-
    - An item or element: its ID, `#CORE-12`.
    - A decision or comment: the change record's ID, a dot, and its number, `#2026-11-10-round-67-deep-links.D3`, `#…round-66.F1`. The page also takes `round-N.D3` while only one change has that round, and a bare `D3` or `F1` by the rule the CLI follows (the newest change's, unless another change has an open decision of that number); a short form that names more than one thing lists every candidate.
    - A focus link: `#focus~CORE-12~2026-11-10-round-67-deep-links.D3`, the targets in order, joined by '~'. Where they arrive, as in a file opened locally, `#focus=A,B` and `?focus=A,B` work too. A tab's name, such as `#items`, opens that tab.
    - One target opens where it sits: an item in the full spec, shown whatever the filters say, its details open, highlighted and scrolled to below the header; a decision or comment under For you. A target shown nowhere else (a resolved decision, an older comment) or a short form naming several opens on its own, as in a focus link.
    - The page follows the link when it loads and on every hashchange. Leaving a link redraws the page, so answers given on the linked view show everywhere, and clears the fragment, so tapping the same link again works. Show everything, or going back to no fragment, returns the person to the tab and place they left; choosing a tab goes to that tab.
    - Inside the page, an item on the look-at-this list opens beside the reader, as any item does (REVIEW-28); only a decision, a comment or a focus link moves the view.
    - The toolkit computes the table of forms once (`links.index`) and embeds it in the page, so the page and `spec review --link` can't disagree. `spec review --link` prints the full form, which no later change can make ambiguous, and, without `--url` or `--out`, the fragments with a line on how to use them: the toolkit can't know where a page was published.
  alternatives: |-
    '/' as in `<change>/D3`, `#focus=…` and `?focus=` as the printed forms: they don't reach a page published as an artifact. `round-N.D3` as the printed form: shorter, but round numbers repeat after branches merge. Resolving forms in the page's script alone: two implementations of one rule, free to drift apart.
  consequences: Links to decisions and comments are long. An agent that published the page passes its address with `--url` to print whole links. The page's parsing is tested by running its own functions under Node where Node is installed (the evals shell); the default development shell has none, so there that test is skipped, and the resolution rules are tested in Python.
