- id: LANG-3
  text: |-
    Each adapter shall provide three operations: list a repository's tests, run a chosen set of tests, and return a named test's source.
  traces_to: SYS-22
  why: these are the minimum that CHECK-3, CHECK-9 and UNIT-1 need. Coverage collection can come later.
