- id: DR-38
  title: The skill ships inside the package, and setup installs it with the launcher's name filled in
  decided_by: agent
  elements:
  - AGENT
  - CLI
  requirements: AGENT-42, SYS-27, CLI-9
  recorded: round 11 (slice 3)
  context: The method is one portable skill (DR-1). It has to reach each repository, and the commands it gives have to work there however the machine installs Python.
  decision: |-
    The skill lives in the Python package, so installing the toolkit installs it. It is SKILL.md plus four reference pages: writing requirements, auditing, onboarding, and the rules page the checker links to.
    - `spec init` writes one copy, in .agents/skills/syseng, the cross-tool location Hermes and Antigravity read. For Claude Code, which reads only .claude/skills, .claude/skills/syseng is a link to that copy. Hermes loads a repository's skills only after `hermes skills trust`.
    - The copy is the skill exactly as written: it has no placeholders and names no harness, tool or package manager.
    - What each harness's hooks do goes in the instruction-file section, which every harness reads.
  alternatives: A skill that tells agents to run `spec` from the PATH, which breaks whenever the toolkit lives in a virtual environment the agent's shell hasn't activated. Keeping the skill outside the package, which pip wouldn't install.
  consequences: The installed copy is committed with the repository, so it can fall behind the toolkit; `spec init --check` reports the difference and `spec init` refreshes it. A checkout on a system without symlinks would see the link as a plain file, and Claude Code would miss the skill there. The rules page moved from docs/ into the skill.
  status: superseded in round 17 by DR-53 on where the skill is installed. Its rules for the skill's content still hold.
  basis: derived
- id: DR-40
  title: Claude Code hooks are one standard-library script, committed with the repository
  decided_by: agent
  elements:
  - AGENT
  requirements: AGENT-20, AGENT-12, SYS-27
  recorded: round 11 (slice 3)
  context: The spec guard (DR-3), the done gate (DR-4) and chat locks (DR-6) need hooks. The guard runs before every edit and shell command, so it must be fast, and it should work on a clone where the toolkit isn't installed yet.
  decision: |-
    `.syseng/hook` is one Python script that uses only the standard library. `spec init` copies it from the package and registers it in .claude/settings.json for three events: before each tool call, when the agent stops, and when the engineer sends a message.
    - It refuses a tool call by exiting with code 2, giving the reason on standard error.
    - The guard refuses edits to the files the toolkit manages: elements, change records, lock records, retired IDs and generated views. Its refusal names the command to use. toolkit.yaml and hand-written pages such as the glossary stay editable.
    - For shell commands, it refuses plain writes into those files: redirections, tee, rm, mv, cp, and in-place sed or perl.
    - When the agent stops with errors in the spec, it sends the findings back as feedback, which Claude Code doesn't show as an error.
    - Only the stop and prompt hooks run the toolkit, as `spec` from the PATH. When it isn't installed, nothing is blocked, and the engineer sees a notice.
  alternatives: Hooks that call the toolkit for everything, which costs a Python start-up with PyYAML on every tool call and fails on machines without the toolkit. A Claude Code plugin, which DR-1 ruled out.
  consequences: A script that opens spec files itself, in python or awk, gets past the guard. The change log and the auditors are the backstop. The hook copy can fall behind the toolkit until `spec init` runs again.
  basis: derived
- id: DR-41
  title: Chat locks are recorded only when they name items by ID, and anything else is confirmed first
  decided_by: agent
  elements:
  - AGENT
  requirements: AGENT-21, AGENT-33, AGENT-34, AGENT-43
  recorded: round 11 (slice 3)
  context: |-
    DR-6 has a hook record chat locks: a message that starts with "approve" (now also "lock") and names the items, or locks everything except some items. A hook can't tell which items "everything" covered in the agent's last message, or which items a described exception refers to (AGENT-43). It also can't see what the engineer was last shown (AGENT-34).
  decision: |-
    The prompt hook reads each line of the engineer's message on its own. A line locks items when it starts with "approve" or "lock" (or "approved", "locked") and its first clause names only item IDs and ranges, or when it is only item IDs followed by "LGTM", "approved", "locked" or "looks good", as in "SYS-32 LGTM".
    - An ID may be written as a word and a number, such as "Change 13", when the word names a system element, needs or decision records (AGENT-57).
    - It records the whole message as the engineer's words, marked as given in chat, and tells the agent what it recorded.
    - Any other lock line, such as one that locks everything except the wording ones, records nothing. The hook tells the agent to show the exact list, leaving out every item an exception could refer to, and to get the engineer's confirmation, in a menu where the harness has one.
    - Quoted lines and pasted text never count, and a capitalized word counts as a system element only when that element exists. A message with "lgtm" or "looks good" and no IDs gets a note that it locks nothing.
  alternatives: Reading "everything" as every item not locked in the open change, which can lock items the engineer was never shown. Letting the agent interpret every lock, which DR-6 ruled out.
  consequences: A line that locks everything except some items costs one extra confirmation. A lock covers the items as they are when the engineer sends the message, and the hook asks the agent to say if it changed any of them after showing them. Claude Code also runs this hook for messages from other sessions and from background subagents, so an agent that sent a message starting with "approve" or "lock" could create a lock. The skill forbids that, and each lock records its words.
  status: amended in round 18 by DR-62. The hook records no message text, and a pasted feedback block from the review page counts.
  basis: derived
- id: DR-57
  title: A conflict with an explicit or stated item is raised with options, before building in spec-first mode and once built in code-first mode
  decided_by: engineer
  elements:
  - AGENT
  - CHANGE
  - CLI
  requirements: SYS-49, NEED-25, CHANGE-17, CHANGE-18, CLI-22, CHECK-26, AGENT-61
  recorded: round 18
  context: Under DR-15 a code-first change finishes and reports, and SYS-37 asks about alterations once they're built. The engineer wants requests that conflict with nothing built without interruption, and a request that conflicts with earlier intent answered with the conflict, the requirements involved, and ways to reword, edit, add or change items. They prefer conflicts shown on the review page, and left the agent-side tooling to the agent.
  decision: |-
    - A request conflicts with an item when it can't be met without changing that item's meaning, or when it makes the item impossible to meet.
    - For each request, the agent compares it with the explicit and stated items in the elements it affects, in the elements that depend on those, and above them in the trace (AGENT-61).
    - A conflict becomes an open decision that names the conflicting items and offers options (reword, edit, add, change, roll back, or drop part of the request), one recommended, each showing the new text it would give the items. It heads the review page, and the agent says in chat that it's there, with enough to answer in chat.
    - **Spec-first mode:** the conflict is raised before building. The CLI refuses an edit that changes the text of an explicit or stated item unless the edit names a conflict a person resolved for that item, adds the person's own request for the change as an intent record, or is declared a rewording.
    - **Code-first mode:** the change is built, and the spec, committed with the code, is updated with it. When the agent marks the change done, the checker reports each altered explicit or stated item that no conflict names, so the agent must raise each one with options, rolling back included.
    - A declared rewording is shown on the review page as one, for the person to check. The refusal and the done check are guardrails against forgetting, not a security boundary.
    - Alterations that match what the chosen option showed count as kept, and the choice is recorded as stated intent on those items, with the person's identity.
  alternatives: Asking after building, as DR-15 and SYS-37 do, which builds on a reading the engineer may reject. A separate impact command listing the locked items in scope before any edit, which was dropped because the edit context already shows them and only the edit says what the request changes.
  consequences: DR-15 holds. Code-first changes never stop, and spec-first changes stop for conflicts. In code-first mode a request may be built on a reading the person then rejects, and the roll-back option is the remedy.
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-21'
    context: Discussing how changes should treat items a person stated or locked.
    said: |-
      Wants the flow to be: build feature X, done; build feature Y, done; build feature Z, and the agent answers that it conflicts with X in specific ways, lists the requirements involved, and offers ways to reword, edit, add or change items. Prefers such conflicts shown to the person on the review page, and is indifferent about the agent-side tooling.
    basis: guided
    fingerprint: 7d3f1afbb073
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-21'
    context: Reviewing NEED-25 in round 18, which then had conflicts raised before building in every case.
    said: |-
      Corrected that raising a conflict before building isn't always wanted: the spec is committed with the code, so building first and confirming after must be supported too. Both workflows, spec first then build and build first then spec, are first class.
    basis: guided
    fingerprint: 7d3f1afbb073
- id: DR-62
  title: What a person says becomes intent without an approval step, and locks stay a person's own act
  decided_by: engineer
  elements:
  - AGENT
  - MODEL
  - REVIEW
  - CLI
  requirements: SYS-44, MODEL-37, AGENT-21, AGENT-50, AGENT-56, AGENT-63, REVIEW-25, SYS-51, SYS-53, CLI-23, CLI-27
  recorded: round 18
  context: The engineer found approvals too prescriptive (typed lines, IDs, confirmations) and wants what they say in conversation locked in automatically, with the review page used for confirming. AGENT-48's typed line is removed in this round.
  decision: |-
    - When a person says what they want, in conversation or in a page comment, the agent adds an intent record to each item the words directly express: stated when the words alone say what the item requires, guided when the person's choice or constraint fixed it. When unsure, the lower level (AGENT-63). A restatement of an existing item is a stated intent record, not an approval.
    - The review page shows what was captured since the person's last review, to correct or remove.
    - A lock (the explicit level) is a person's own act: a page control, the terminal, or a lock line in chat, which the prompt hook still reads as a shortcut.
    - Records made mechanically, by the prompt hook or from a feedback block, hold no words: the person, the channel, the IDs and the fingerprints.
    - A feedback block names its reviewer, carries fingerprints, and reads on its own as review notes (SYS-53). The person pastes it to the agent, or posts it on a pull request as their review, and the agent applies it with the CLI (D2). The block, not the machine applying it, names who gave each lock; where the block was posted is the evidence of who wrote it.
  alternatives: Keeping approval in chat by ID only (DR-41), which is the ritual the engineer wants gone. Letting the agent lock what a person says, which would make every captured remark explicit and leave the explicit level meaning nothing.
  consequences: A misreading by the agent becomes intent until the person corrects it on the page, so the captured-intent section matters. DR-6 and DR-41 are amended, and pasted text counts when it's a feedback block.
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-21'
    context: Revising the chat-approval rules (AGENT-33, AGENT-48, DR-41).
    said: Finds the approval process too prescriptive. Wants a free-form conversational flow, more use of displays for confirming, and requirements a person mentions in conversation locked in automatically. The approval vocabulary can go.
    basis: guided
    fingerprint: 7592f405900b
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-21'
    context: |-
      Answering D2, which asked who applies a feedback block pasted from the review page: the prompt hook or the agent.
    said: |-
      Chose the agent. The person pastes the block, so it can travel: a pull-request reviewer can post it on the pull request as review notes, or an author can review their own change and paste it to the agent. The aim is system-level review in place of code review, since code will soon be too large for people to review.
    basis: guided
    fingerprint: 7592f405900b
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-21'
    context: Setting a condition on recording what a person says as intent on the items it expresses (SYS-44).
    said: |-
      The agent has to judge which items a statement directly expresses, but should keep it tight rather than loose: for a request for a self-driving car, the requirement that the car drives itself can be marked as theirs, but a detail such as a module producing the next stretch of driving trajectories is not.
    basis: guided
    fingerprint: 7592f405900b
- id: DR-71
  title: The skill is a router over task-sized references
  decided_by: agent
  elements:
  - AGENT
  - ONBOARD
  requirements: AGENT-65, ONBOARD-8, ONBOARD-9, ONBOARD-10, ONBOARD-11
  context: In a trial, three agents onboarded copies of a nine-app repository with the skill. Each read every reference in full, needed none of the review, feedback and lock material, and still read the toolkit's source to learn field names. They diverged most on requirement depth (226 to 445 requirements for the same code) and on how honestly they reported coverage.
  decision: SKILL.md keeps the loop, levels of intent, capturing intent and editing, and opens with a table naming each reference, the task that needs it and its size. Review, feedback, locks and conflicts move to references/review-and-locks.md; every kind's fields move to a new references/schema.md with block-style examples. The onboarding reference becomes a checklist with a preflight, an altitude rule, a build order, a partly-met rule and affordable ways to run every check. Long references open with their contents, and none links to another.
  alternatives: Keeping one long SKILL.md, which agents read in full for every task. Splitting onboarding into its own skill, which would duplicate the editing and intent rules.
  consequences: An agent changing code reads about 100 lines; an onboarding agent reads about 250. Tests hold the layout to Anthropic's skill-authoring guidance.
  basis: derived
- id: DR-74
  title: Apply the engineer's overnight review
  decided_by: engineer
  elements:
  - AGENT
  - CHECK
  - ONBOARD
  - REVIEW
  requirements: AGENT-71, CHECK-31, CHECK-32, ONBOARD-8, REVIEW-38
  context: The engineer answered the overnight review page on the depth rules, six prescriptive rules, the toolkit fixes, system-level verification, the pre-migration steps and the merge.
  decision: |-
    - The depth rules are adopted (round 37 D4).
    - Cut: the split point of about 30 requirements, splitting along test seams, and the cap of about 15 questions. Kept: one decision record per design topic (now scoped to values found in existing code), the onboarding order, and grouping thin parts of the same shape.
    - Wording rules can be allowed per item with a reason (CHECK-31).
    - A requirement can be verified by its children through a roll-up verification item, and the to-do for a parent says how to resolve it (CHECK-32).
    - The preflight questions are raised post-flight, first on the review page, while the spec stays unpublished (ONBOARD-8).
    - The unlinked-test list and the tested-coverage measure are locked by the engineer (CHECK-3, REVIEW-38).
  alternatives: Keeping the numeric rules, which drove some convergence but presumed tests exist and fixed counts the engineer would rather not encode.
  consequences: Element splitting and question counts are left to agents' judgment; the next migration shows whether counts stay close without them.
  basis: derived
- id: DR-78
  title: The offer to report a problem belongs in the hand-over step
  decided_by: agent
  elements:
  - AGENT
  requirements: AGENT-72
  context: The rule sat in the last section of the skill, outside the loop agents follow. An eval found agents with the skill offered a report only about half the time.
  decision: Step 8 of the loop says to mention anything in the toolkit that got in the way and offer to report it. The last section points to it.
  alternatives: Leaving it where it was. A reminder printed when a change closes, which isn't tried yet.
  consequences: In 120 side-by-side runs, when the skill loaded the offer rose from 23 of 30 to 33 of 34. With the instructions a real repository gets in its fixture, the skill loaded 26 of 30 times, against 3 of 30 without. With a real toolkit limit in the case, agents offered a report 13 of 15 times with the skill and 1 of 15 without.
  basis: derived
