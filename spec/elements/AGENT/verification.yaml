- id: AGENT-V1
  verifies:
  - AGENT-40
  method: test
  technique: unit test
  description: An open decision is refused unless it says why it ranks where it does.
  tests:
    python:
    - tests/test_decisions.py::test_decision_says_why_it_ranks_where_it_does
- id: AGENT-V2
  verifies:
  - AGENT-20
  method: test
  technique: unit test
  description: An agent's edit or write to each kind of file the toolkit manages is refused, and the refusal names the command to use instead. Edits to the toolkit's settings file, hand-written pages and code pass. Shell commands that redirect into, tee into, edit in place, remove, move or copy over a managed file are refused. Reading those files and running the toolkit pass.
  tests:
    python:
    - tests/test_hooks.py::test_agents_cannot_edit_files_the_toolkit_manages
    - tests/test_hooks.py::test_agents_may_edit_files_the_toolkit_does_not_manage
    - tests/test_hooks.py::test_shell_writes_into_the_spec_are_refused
    - tests/test_hooks.py::test_shell_reads_and_toolkit_commands_are_allowed
- id: AGENT-V3
  verifies:
  - AGENT-12
  method: test
  technique: integration test
  description: When the agent stops while the spec has errors, the stop hook sends it back once with each finding in the checker's format, as feedback rather than an error. When the agent is already continuing because of that, the hook lets it stop. With no errors the agent stops without a message. On a machine without the toolkit, the engineer gets a notice instead.
  tests:
    python:
    - tests/test_hooks.py::test_stop_blocks_once_with_the_findings
    - tests/test_hooks.py::test_stop_lets_a_clean_spec_finish
    - tests/test_hooks.py::test_stop_tells_the_engineer_when_the_toolkit_is_missing
- id: AGENT-V4
  verifies:
  - AGENT-21
  - AGENT-33
  - AGENT-43
  method: test
  technique: integration test
  description: A line that locks items by ID records each item's lock, with no words but a note that the prompt hook recorded it, marked as given in chat, and the agent is told what was recorded. Such a line either starts with "approve" or "lock", or is only IDs followed by "LGTM", and it may be any line of a longer message. Lines that lock "everything", give an exception by description, or mix IDs with other words record nothing, and the agent is told to confirm the exact list. "lgtm" without IDs, quoted lines, pasted text, capitalized words that aren't elements, and unknown IDs record nothing.
  tests:
    python:
    - tests/test_hooks.py::test_approvals_that_name_items_by_id_are_read
    - tests/test_hooks.py::test_approvals_that_need_interpreting_are_not_read
    - tests/test_hooks.py::test_lines_that_approve_no_items_are_ignored
    - tests/test_hooks.py::test_chat_approval_is_recorded_without_the_engineers_words
    - tests/test_hooks.py::test_approval_on_any_line_of_a_longer_message
    - tests/test_hooks.py::test_quoted_lines_are_not_approvals
    - tests/test_hooks.py::test_described_exceptions_record_nothing
    - tests/test_hooks.py::test_lgtm_is_not_an_approval
    - tests/test_hooks.py::test_pasted_text_is_not_the_engineers_approval
- id: AGENT-V5
  verifies:
  - AGENT-42
  method: inspection
  technique: unit test
  description: No page of the skill names an agent harness, a harness's own tools or instruction files, or Nix. The skill's front matter follows the Agent Skills format. Every toolkit command that the skill and the subagents name exists.
  tests:
    python:
    - tests/test_skill.py::test_skill_names_no_particular_harness
    - tests/test_skill.py::test_skill_frontmatter_follows_the_agent_skills_format
    - tests/test_skill.py::test_every_command_the_skill_names_exists
- id: AGENT-V6
  verifies:
  - AGENT-45
  method: inspection
  technique: unit test
  description: The skill has a section that invites agents to improve it, and that section names the command for reporting friction.
  tests:
    python:
    - tests/test_skill.py::test_skill_invites_agents_to_improve_it
- id: AGENT-V7
  verifies:
  - AGENT-46
  method: test
  technique: unit test
  description: Reporting friction records the workaround and the proposed improvement in the open change, where the engineer reads them.
  tests:
    python:
    - tests/test_decisions.py::test_friction_is_logged_with_a_proposal
- id: AGENT-V8
  verifies:
  - AGENT-47
  - AGENT-49
  method: test
  technique: integration test
  description: For a harness without hooks, the instruction-file section says that none run and that recording locks, editing through the CLI and checking before reporting are the agent's job. With Claude Code set up too, it also names each hook and what it does. The skill has no placeholders, so it's installed exactly as written.
  tests:
    python:
    - tests/test_init.py::test_hermes_gets_its_link_and_the_note_that_no_hooks_run
    - tests/test_init.py::test_the_instructions_say_what_each_harness_hooks_do
    - tests/test_skill.py::test_the_skill_is_installed_as_is
- id: AGENT-V10
  verifies:
  - AGENT-50
  - AGENT-51
  - AGENT-52
  - AGENT-53
  - AGENT-54
  - AGENT-55
  - AGENT-56
  method: inspection
  technique: unit test
  description: The skill tells agents to propose items for locking, most consequential first; to ask about each alteration with the lock line that keeps it; to summarize the engineer's reasoning with a context that adds no claim; to place requirements by the system element they constrain; to add a request as intent to the items that already cover it, including a restatement; to record the lower level when unsure; to record a requirement for each feature they add unasked; and to look for conflicts with locked or stated items.
  tests:
    python:
    - tests/test_skill.py::test_skill_teaches_the_approval_model
- id: AGENT-V11
  verifies:
  - AGENT-57
  method: test
  technique: unit test
  description: |-
    "Core 13 LGTM.", "need 16 LGTM" and "approve dr 4 and Core 2" lock the items they name when CORE is a system element. "Round 12 LGTM" locks nothing.
  tests:
    python:
    - tests/test_hooks.py::test_ids_written_out_in_words_are_read
    - tests/test_hooks.py::test_words_that_only_look_like_ids_are_not_read
- id: AGENT-V12
  verifies:
  - AGENT-12
  - AGENT-20
  - AGENT-21
  - REASON-5
  method: demonstration
  technique: manual
  description: |-
    In headless Claude Code sessions in a scratch repository set up by `spec init`, whose spec has one wording error: finishing a turn brings the error back as feedback, an Edit to a spec file is refused with the command to use, "need 1 lgtm" records NEED-1's lock in chat, and the reasoning-check subagent's search of the whole repository is refused.
- id: AGENT-V13
  verifies:
  - AGENT-62
  method: inspection
  technique: unit test
  description: The skill tells agents to hand over the review page at the end of each change, to apply a pasted feedback block as it is, and to answer each feedback item.
  tests:
    python:
    - tests/test_skill.py::test_skill_teaches_the_approval_model
