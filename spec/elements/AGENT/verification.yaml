- id: AGENT-V4
  verifies:
  - AGENT-21
  - AGENT-33
  - AGENT-43
  method: test
  technique: integration test
  description: A line that locks items by ID records each item's lock, with no words but a note that the prompt hook recorded it, marked as given in chat, and the agent is told what was recorded. Such a line either starts with "approve" or "lock", or is only IDs followed by "LGTM", and it may be any line of a longer message. Lines that lock "everything", give an exception by description, or mix IDs with other words record nothing, and the agent is told to confirm the exact list. "lgtm" without IDs, quoted lines, pasted text, capitalized words that aren't elements, and unknown IDs record nothing.
  tests:
    python:
    - tests/test_hooks.py::test_approvals_that_name_items_by_id_are_read
    - tests/test_hooks.py::test_approvals_that_need_interpreting_are_not_read
    - tests/test_hooks.py::test_lines_that_approve_no_items_are_ignored
    - tests/test_hooks.py::test_chat_approval_is_recorded_without_the_engineers_words
    - tests/test_hooks.py::test_approval_on_any_line_of_a_longer_message
