- id: AGENT-V12
  verifies:
  - AGENT-12
  - AGENT-20
  - AGENT-21
  - REASON-5
  method: demonstration
  technique: manual
  origin: agent
  description: |-
    In headless Claude Code sessions in a scratch repository set up by `spec init`, whose spec has one wording error: finishing a turn brings the error back as feedback, an Edit to a spec file is refused with the command to use, "need 1 lgtm" records NEED-1's approval in chat, and the reasoning-check subagent's search of the whole repository is refused.
