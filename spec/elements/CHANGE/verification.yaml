- id: CHANGE-V1
  verifies:
  - CHANGE-3
  method: test
  technique: unit test
  description: A change record keeps its open decisions, and its view lists them.
  tests:
    python:
    - tests/test_decisions.py::test_view_puts_open_decisions_first_and_flags_the_engineers_items
- id: CHANGE-V2
  verifies:
  - CHANGE-4
  - CHANGE-8
  - CHANGE-9
  method: test
  technique: unit test
  description: Opening a change records a summary of the request; with no mode named the change is code-first, and its target defaults to the primary implementation.
  tests:
    python:
    - tests/test_edit.py::test_change_defaults_to_code_first_and_the_primary_target
    - tests/test_edit.py::test_spec_first_mode_is_recorded
- id: CHANGE-V3
  verifies:
  - CHANGE-5
  method: test
  technique: unit test
  description: Every edit is logged in the open change record with its reason and the item's meaning before and after; an edit without a reason, or with no change open, is refused.
  tests:
    python:
    - tests/test_edit.py::test_edits_are_logged_with_reasons_in_the_change_record
    - tests/test_edit.py::test_every_operation_needs_a_reason
    - tests/test_edit.py::test_edit_requires_an_open_change
- id: CHANGE-V4
  verifies:
  - CHANGE-10
  method: test
  technique: unit test
  description: An open decision is refused unless it offers at least two options with exactly one recommended.
  tests:
    python:
    - tests/test_decisions.py::test_decision_needs_options_with_exactly_one_recommended
- id: CHANGE-V5
  verifies:
  - CHANGE-11
  method: test
  technique: unit test
  description: An open decision involving an item the engineer stated is flagged in the change record view.
  tests:
    python:
    - tests/test_decisions.py::test_view_puts_open_decisions_first_and_flags_the_engineers_items
- id: CHANGE-V6
  verifies:
  - CHANGE-12
  method: test
  technique: unit test
  description: One resolve command records the recommended option for every named decision, with a summary of the engineer's answer.
  tests:
    python:
    - tests/test_decisions.py::test_resolve_takes_the_recommended_options_for_a_set
    - tests/test_decisions.py::test_resolve_a_specific_option
- id: CHANGE-V7
  verifies:
  - CHANGE-13
  - CHANGE-14
  - CHECK-21
  method: test
  technique: integration test
  description: Rewording a requirement in the engineer's words needs an acknowledgment first. Once applied, the change record lists it with the line that keeps it, and it's a to-do, until the engineer locks it as reworded, after which it's listed as kept. Rewording it back to its earlier text answers it as rolled back.
  tests:
    python:
    - tests/test_review.py::test_altering_the_engineers_words_is_raised_until_kept
    - tests/test_review.py::test_rolling_back_an_alteration_answers_it
- id: CHANGE-V8
  verifies:
  - CHANGE-15
  - CLI-14
  method: test
  technique: integration test
  description: A proposal with a reason is listed in the change record with one line locking what's still waiting, and is marked locked once the engineer locks it. A proposal without a reason is refused.
  tests:
    python:
    - tests/test_review.py::test_proposals_are_listed_with_reasons_until_approved
    - tests/test_review.py::test_a_proposal_needs_a_reason
- id: CHANGE-V9
  verifies:
  - CHANGE-14
  - CLI-6
  method: test
  technique: unit test
  description: Editing an item an agent added earlier in the same change, with no lock since, asks for no acknowledgment and isn't listed as an alteration. An element that only gains a dependency asks for no acknowledgments from the decisions about it.
  tests:
    python:
    - tests/test_levels.py::test_editing_an_item_added_earlier_in_the_same_change_alters_nothing_a_person_gave
    - tests/test_levels.py::test_an_element_gaining_a_dependency_needs_no_acknowledgments
- id: CHANGE-V10
  verifies:
  - CHANGE-20
  method: test
  technique: unit test
  description: An open decision rewritten in place keeps its ID and position; rewriting an unknown or answered decision is refused.
  tests:
    python:
    - tests/test_decisions.py::test_an_open_decision_can_be_rewritten_in_place_until_answered
- id: CHANGE-V11
  verifies:
  - CHANGE-21
  method: test
  technique: unit test
  description: Withdrawing an open decision needs a reason, marks it withdrawn with that reason, and is refused for a decision already withdrawn.
  tests:
    python:
    - tests/test_decisions.py::test_an_overtaken_decision_is_withdrawn_with_a_reason
- id: CHANGE-V12
  verifies:
  - CHANGE-22
  method: test
  technique: unit test
  description: A decision checked with the dry-run option is reported valid and isn't recorded.
  tests:
    python:
    - tests/test_decisions.py::test_a_decision_can_be_checked_without_recording_it
