- id: VERIFY-2
  text: |-
    The runner shall support three techniques in its first release: unit test, integration test and reasoning check.
  origin: engineer
  traces_to: SYS-10
  source: |-
    "'software unit test'" · "'REASONING TEST'" · "'INTEGRATION TEST'"
- id: VERIFY-3
  text: The runner shall run independent verification items in parallel.
  origin: engineer
  traces_to: SYS-10
  source: |-
    "the skill has a tool for running these in parallel and reporting back"
- id: VERIFY-4
  text: After each run, the runner shall report each verification item's result.
  origin: engineer
  traces_to: SYS-10
  source: as VERIFY-3.
- id: VERIFY-5
  text: |-
    The runner shall derive each verification item's status in each implementation: not implemented, not yet run, passing or failing.
  origin: engineer
  traces_to: SYS-9
  source: |-
    "the specs should mark in some way what has been implemented yet, and what has not (e.g. don't expect tests to pass, perhaps VIs have been specced but not implemented)"
- id: VERIFY-8
  text: When an expensive-tier item fails, the runner shall add the failure to the change's open decisions.
  origin: engineer
  traces_to: SYS-16
  source: |-
    "If reasoning or integration+reasoning tests fail, the LLM should add it to a list of things to flag to the user."
- id: VERIFY-12
  text: At the end of a full run, the toolkit shall produce a summary of the product's health.
  origin: engineer
  traces_to: SYS-13
  source: |-
    "come back with … an AI summary of the health of the code"
- id: VERIFY-14
  text: When the engineer requests verification of a change, the runner shall include the verification items of every system element that depends, directly or indirectly, on an element the change touched.
  origin: engineer
  traces_to: SYS-10
  source: |-
    Q24: "if the general utility changes, and I ask for a comprehensive verification, it triggers VI's on RENDER and PHYSICS"
- id: VERIFY-13
  text: The health summary shall list each system element's verification status, each change the run made with its reason, each unapproved item, and each requirement without verification.
  origin: agent
  traces_to: SYS-13
  why: |-
    what you'd want to know on returning: what's broken, what agents changed while you were away, and what's waiting for you.
