- id: VERIFY-V1
  verifies:
  - VERIFY-17
  - VERIFY-19
  method: test
  technique: unit test
  description: Report files, several in one command, and outcomes given by hand are recorded with step, revision and time, per implementation, and combine across steps in any order. The revision defaults to version control's current one, and an empty report records nothing.
  tests:
    python:
    - tests/test_results.py::test_steps_add_up_in_any_order_into_one_status
    - tests/test_results.py::test_several_reports_in_one_command
    - tests/test_results.py::test_results_are_kept_per_implementation
    - tests/test_results.py::test_a_record_keeps_the_step_revision_time_and_outcomes
    - tests/test_results.py::test_the_revision_defaults_to_version_controls_current_one
    - tests/test_results.py::test_an_empty_report_records_nothing_and_keeps_what_was_there
    - tests/test_results.py::test_a_bad_ran_at_is_refused
    - tests/test_results.py::test_a_corrupt_results_file_is_skipped_with_a_warning
- id: VERIFY-V2
  verifies:
  - VERIFY-18
  method: test
  technique: unit test
  description: Reporting a step again on the same revision replaces its earlier results, while outcomes given one at a time join their step.
  tests:
    python:
    - tests/test_results.py::test_a_retry_replaces_its_step
    - tests/test_results.py::test_verdicts_given_one_at_a_time_share_a_step
- id: VERIFY-V3
  verifies:
  - VERIFY-20
  - VERIFY-21
  method: test
  technique: unit test
  description: The newest result by when it ran decides, an older result still counts, a skip counts as not run, a file that can't be imported fails its linked tests, and an item names the revision it was last tested in.
  tests:
    python:
    - tests/test_results.py::test_a_results_newest_outcome_decides_and_names_where_it_was_last_tested
    - tests/test_results.py::test_an_older_result_still_counts
    - tests/test_results.py::test_a_skip_counts_as_not_run
    - tests/test_results.py::test_when_tests_ran_decides_not_when_they_were_added
    - tests/test_results.py::test_a_file_that_cannot_be_imported_fails_its_linked_tests
- id: VERIFY-V4
  verifies:
  - VERIFY-5
  - VERIFY-22
  - VERIFY-4
  method: test
  technique: unit test
  description: Each implementation gets counts of the four statuses, and the status command prints them with each item's status. A roll-up follows its children, is not passing with an unverified child, and takes no verdict of its own.
  tests:
    python:
    - tests/test_results.py::test_status_counts_each_implementation_separately
    - tests/test_results.py::test_the_status_prints_for_people
    - tests/test_results.py::test_a_roll_up_follows_its_children
    - tests/test_results.py::test_a_roll_up_with_an_unverified_child_is_not_passing
    - tests/test_results.py::test_a_verdict_cannot_override_a_roll_ups_failing_child
    - tests/test_results.py::test_a_roll_up_over_a_parent_and_its_child_terminates
- id: VERIFY-V5
  verifies:
  - VERIFY-23
  - VERIFY-28
  method: test
  technique: unit test
  description: Failures are listed by level of intent, and the command fails only when an item is failing.
  tests:
    python:
    - tests/test_results.py::test_failures_are_listed_by_level_of_intent_and_fail_the_command
    - tests/test_results.py::test_a_retry_replaces_its_step
