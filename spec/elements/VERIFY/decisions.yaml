- id: DR-14
  title: Expensive verification only when the engineer asks
  decided_by: engineer
  elements:
  - VERIFY
  - AGENT
  requirements: SYS-12, AGENT-30
  recorded: round 4 (decided in rounds 2 and 3)
  context: reasoning checks and long runs cost tokens and time. The engineer wants to move fast and to decide when these run.
  decision: |-
    expensive items run only when the engineer asks: for a full run, a single change, or onboarding (ONBOARD-3). Agents always run every cheap item before reporting a change as done.
  alternatives: running expensive items automatically at merge, which was my first proposal.
  consequences: regressions that only expensive checks would catch wait for the next requested run.
  intent:
  - by: Alex Thiele <alex.g.thiele@gmail.com>
    when: '2026-10-11'
    context: Date approximate (rounds 2 and 3). Answering Q2, on when expensive verification runs; the agent had first proposed running expensive items automatically at merge.
    said: Wants to move fast and to decide when expensive checks run, so they run only on request, while cheap checks run after every change.
    basis: stated
    fingerprint: 2f9c3f82b590
- id: DR-76
  title: Readers and version-control backends are modules found by name
  decided_by: agent
  elements:
  - VERIFY
  - VCS
  requirements: SYS-58, SYS-59
  context: The engineer wants new formats and version-control systems added easily, and prefers a reader requested through an issue to parsers written per project.
  decision: Each reader is a file in syseng/readers and each backend a file in syseng/vcs. The package lists its modules, and a format or backend is chosen by module name, so adding one is adding one file. Readers own how test identifiers are built. An outcome given with --id joins its step, while a report replaces it.
  alternatives: A registry to edit, which breaks the no-change rule. Plugins installed from outside the toolkit, which the engineer's preference for shared readers doesn't need yet.
  consequences: A reader or backend ships with the toolkit, so a private system's backend needs a toolkit release or a fork until plugins exist.
  basis: derived
