  text: |-
    Five levels of intent, computed from locks, intent records and a recorded basis: Five levels, highest first: - **explicit:** a person locked it by name, on the review page, in chat or in the terminal. A lock record, which is what an approval record was before round 18. - **stated:** a person asked for this item. An intent record with the basis stated. - **guided:** a person shaped it without asking for it, for example by choosing an option, reacting to a demo, or giving a constraint it follows from. An intent record with the basis guided. - **derived:** something above it needs it, and no person addressed it. The basis derived. - **added:** an agent's own idea, which nothing a person asked for needs. The basis added. An item takes its highest level. An explicit, stated or guided item shows as changed once its content differs from what its lock or intent record was given for. Levels are computed each time and never stored. Choosing stated or guided, and derived or added, is the agent's judgment when it records the item, and the review page shows each one for correction. The basis records how an item came about, not how much it matters, so SYS-40 holds: agents still weigh dates, edit counts and discussions for themselves. What each level means for a later change: a conflict with an explicit or stated item is raised before building (DR-57); an alteration to a guided item is asked about once built (SYS-37); derived and added items are changed freely, and the change is logged.
- id: DR-55
  fingerprint: bf89efae2cf4
  locked_at: 2026-10-21T15:51-07:00
  by: Alex Thiele <alex.g.thiele@gmail.com>
  via: page
  batch: 11
  review: 0547dce3ed
  text: |-
    Intent records summarize what a person said, with author and context, and never quote it: Each item takes an intent list. Each record holds: - **by:** the person's name and email address (DR-56); - **when:** the date and time of the statement; - **context:** the agent's account of what was being discussed and what prompted the statement; - **said:** a close summary of what the person said, lightly cleaned up and in the third person. It keeps their hedges and strength, such as probably or must, adds no number or mechanism they didn't give, and says what they left open when they said so; - **basis:** stated or guided (DR-54); - a fingerprint of the item as it was, filled in by the CLI. Quotation marks aren't allowed in these fields. Lock records and change-log reasons summarize in the same way. The migration summarizes the existing verbatim text (DR-61).
- id: DR-57
  fingerprint: 7d3f1afbb073
  locked_at: 2026-10-21T15:51-07:00
