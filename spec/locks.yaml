  review: 0547dce3ed
  text: |-
    A conflict with an explicit or stated item is raised with options, before building in spec-first mode and once built in code-first mode: - A request conflicts with an item when it can't be met without changing that item's meaning, or when it makes the item impossible to meet. - For each request, the agent compares it with the explicit and stated items in the elements it affects, in the elements that depend on those, and above them in the trace (AGENT-61). - A conflict becomes an open decision that names the conflicting items and offers options (reword, edit, add, change, roll back, or drop part of the request), one recommended, each showing the new text it would give the items. It heads the review page, and the agent says in chat that it's there, with enough to answer in chat. - **Spec-first mode:** the conflict is raised before building. The CLI refuses an edit that changes the text of an explicit or stated item unless the edit names a conflict a person resolved for that item, adds the person's own request for the change as an intent record, or is declared a rewording. - **Code-first mode:** the change is built, and the spec, committed with the code, is updated with it. When the agent marks the change done, the checker reports each altered explicit or stated item that no conflict names, so the agent must raise each one with options, rolling back included. - A declared rewording is shown on the review page as one, for the person to check. The refusal and the done check are guardrails against forgetting, not a security boundary. - Alterations that match what the chosen option showed count as kept, and the choice is recorded as stated intent on those items, with the person's identity.
