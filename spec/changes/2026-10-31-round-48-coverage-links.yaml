  conflict: D1
  before:
    title: System requirements are verified at the system level
    decision: each system requirement gets its own verification, such as an end-to-end run or a demonstration, in addition to its children's verification.
    consequences: the VI round will write system-level checks, for example running a code-first change end to end and confirming that it never stopped to ask.
  after:
    title: System requirements are verified at the system level where that means something
    decision: |-
      Each system requirement gets its own verification, such as an end-to-end run or a demonstration, where a test of it wouldn't be arbitrary. Otherwise it rolls up from its children. A roll-up is strict: every child must be verified, and a child may itself be verified by roll-up, so a whole subtree can roll up from its leaves.
    consequences: A system requirement can pass with no end-to-end check, so integration faults can slip through; the important ones should still get their own. The engineer may revisit transitive roll-ups if negative consequences appear.
  acks:
    DR-23: D1
