decisions:
- id: D1
  kind: conflict
  question: Can a system requirement be verified by its children alone, when a test of its own would be arbitrary? DR-23, which you locked, says no.
  importance: This decides what to do with 28 of the 120 unverified requirements, and whether coverage moves from about 67% to about 76% cheaply or takes many new system tests. DR-23 and MODEL-32 say each system requirement gets its own verification in addition to its children's. In round 38 you asked for a way to say a requirement is verified by its children, preferring its own verification where a test wouldn't be arbitrary, and CHECK-32 records that. The two now disagree, and I added five system roll-ups (SYS-V8 to SYS-V12) without noticing they break DR-23, so those are affected too.
  involves:
  - DR-23
  - MODEL-32
  options:
  - label: Own verification where it means something, roll-up otherwise
    recommended: true
    detail: |-
      MODEL-32 and DR-23 change to say a system requirement gets its own verification where a test of it wouldn't be arbitrary, and otherwise rolls up from its children, which the checker holds honest (V004: every child must be verified). Example: SYS-33 (what a lock records) rolls up from MODEL-34 and CLI-12, since a separate test would repeat theirs, while SYS-13 (a full run's report) keeps its own. 10 roll-ups are ready now, and 18 more wait for their children. What follows: a system requirement can pass with no end-to-end check. Standard systems-engineering practice accepts verification by analysis of lower-level results, but integration faults between children can slip through, so the important ones should still get their own.
    keeps:
    - DR-23
    - MODEL-32
  - label: Keep the rule - every system requirement gets its own verification
    detail: DR-23 stands. Each of the system requirements needs an end-to-end test or demonstration, and the five roll-ups I added become to-dos again. Stronger against integration faults, but about 36 unverified system requirements each need a test, many repeating their children's. Coverage stays near 67% until those are written.
    rolls_back:
    - DR-23
    - MODEL-32
  status: open
