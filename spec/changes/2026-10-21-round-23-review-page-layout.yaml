- op: add
  id: DR-66
  at: 2026-10-21T15:08-07:00
  reason: records the layout.
  after:
    title: The review page has two panes, sections as tabs beside the system graph and the item in focus
    decided_by: agent
    elements:
    - REVIEW
    requirements: REVIEW-20, REVIEW-28, REVIEW-29, REVIEW-30
    recorded: round 23
    context: On a single long page, the graph sat below hundreds of changes, opening an item scrolled the reader away, and a decision about ten items could only be answered all at once.
    decision: |-
      - The sections become tabs, in REVIEW-20's order, opening on the first one with anything in it.
      - On a wide screen, the right pane always holds the item in focus and, below it, the system graph. Pointing at an item anywhere highlights it in the graph; clicking it opens it in the pane. On a narrow screen the pane is a drawer that opens when an item is clicked.
      - A decision lists each item it involves in full, each with its own answers (keep, or lock; roll back; suggest wording; comment), and counts how many are answered. The decision's own options stay for answering everything at once.
      - A suggested wording goes back as feedback for the agent, which applies it as the person's stated intent.
      - Items agents proposed for locking come first, apart from the mechanical list of what the most of the tree hangs from (AGENT-51).
    alternatives: Keeping one long page and moving the graph up, which still loses the reader's place. A separate graph page, which loses the link between what's being read and where it sits.
    consequences: Every section is one click away and the graph is always in sight. Answers given item by item can be sent at any time; what's left unanswered stays waiting.
    intent:
    - by: Alex Thiele <alex.g.thiele@gmail.com>
      when: 2026-10-21 14:06
      context: Using the review page for the first time.
      said: Suggested tabs, or the graph on the right, so that hovering over or clicking an item highlights it in the graph; and a side panel for opening an item without losing their place.
      basis: guided
      fingerprint: 86783872b2e5
