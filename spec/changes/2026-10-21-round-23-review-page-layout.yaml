- op: add
  id: DR-67
  at: 2026-10-21T15:15-07:00
  reason: records the fix.
  after:
    title: A conflict's options name the items each keeps and rolls back, so a choice is applied as chosen
    decided_by: agent
    basis: derived
    elements:
    - CHANGE
    - CLI
    requirements: CHANGE-17, CHANGE-18, CLI-23, REVIEW-30
    recorded: round 23
    context: The engineer resolved round 20's conflict over ten items by choosing to keep all ten. The choice was recorded, but nothing said which items it kept, so none was re-recorded at its earlier level and five still showed as changed since locked.
    decision: |-
      - Each option of a conflict may list `keeps:` and `rolls_back:`, naming only items the decision involves.
      - When a person chooses an option on the review page, the items it keeps are re-recorded at their earlier level in the person's name (a lock if they were locked, else a fresh intent record), and the ones it rolls back become feedback items for the agent.
      - Round 20's D1, resolved before this existed, was finished the same way by hand, with a note on each lock naming the decision.
    alternatives: Reading what an option does from its label, which breaks on the first unusual wording. Leaving keeps to the person item by item, which REVIEW-30 offers too but which makes a one-line answer impossible.
    consequences: Agents fill in the lists when they raise a conflict (the skill says so). An option without them still resolves the decision, and its items stay waiting.
