decisions:
- id: D1
  question: When you approve items by picking a menu option, who records the approval?
  importance: It decides whether one click can approve spec items, and whether DR-6's rule that the agent never records approvals still holds. Approvals are your main control over the spec, so this ranks first.
  involves:
  - DR-6
  - AGENT-21
  - AGENT-33
  options:
  - label: The agent, quoting the menu
    recommended: true
    detail: When you pick an approval option from a menu whose question named the items, the agent records it with `spec approve --via menu`, quoting the question and your choice. Every approval so far was recorded this way, and the skill already says so. It's the fastest path for you, and each record carries its words, so a wrong one shows in the change record. DR-6 would be amended to allow it.
  - label: A hook reads the menu answer
    detail: A Claude Code hook records the approval from the menu's result, so no agent ever records one. The menu question would have to name the IDs in a fixed form, it works only in Claude Code, and I couldn't test a hook on the menu tool from this session.
  - label: No approvals from menus
    detail: Menus only resolve decisions. Approvals come from a typed "approve <IDs>" message, your terminal, or the review page. Safest and slowest, and different from how you've approved so far.
  status: resolved
  chosen: The agent, quoting the menu
  words: |-
    [verbatim words removed when this spec moved to intent records]
  resolved: '2026-10-17'
friction:
- workaround: Toolkit messages name commands as `spec …` (for example "list them with `spec check --todo`"), but agents in a set-up repository run `.syseng/spec`; an agent following a message literally gets 'command not found' and has to translate.
  proposal: Have the repository launcher export the name it was run as (SYSENG_PROG=.syseng/spec), and build every command mentioned in messages from it.
closed: '2026-10-17'
