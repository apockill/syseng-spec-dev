decisions:
- id: D1
  question: Should anything about approvals stop a branch from landing on master?
  importance: It decides whether the check you run before landing a branch (`spec check --merge`) can stop you, or only shows you what changed. You answered "presumably nothing" before asking what merge meant, so this confirms it. CHECK-15 and DR-31 change with the answer.
  involves:
  - CHECK-15
  - DR-31
  - NEED-18
  options:
  - label: Nothing blocks; show what changed
    recommended: true
    detail: Before a branch lands, the check lists every item you approved, wrote or decided that changed since the branch left master, so you see them first. It never fails because of approvals. This matches your answer, and with delegation most items never need your approval at all.
  - label: Changed locked items block
    detail: |-
      Landing fails while an item you approved, wrote or decided has changed without your permission. Delegated items never block. Stricter: it turns "raise it with me" into a gate.
  - label: Keep today's rule
    detail: Every unapproved item blocks landing, delegated ones included, which means approving everything.
  status: resolved
  chosen: Nothing blocks; show what changed
  words: Yeah I think its up to the user to decide.
  resolved: '2026-10-17'
friction: []
