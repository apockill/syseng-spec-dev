request: |-
  Approvals carry their signal: who approved each item and how, what is delegated under an approval, the engineer's words kept on the requirements they inform, and changes to locked items raised with the engineer
mode: spec-first
target: python
status: closed
opened: '2026-10-17'
entries:
- op: modify
  id: DR-31
  reason: recording round 12's needs before their requirements was rejected, because an unserved need was an error. Spec-first planning records needs first, and an unserved need is unfinished work, like a requirement without verification.
  before:
    title: Missing verification and missing approvals are to-dos, not errors
    decision: They're reported as to-dos, summarized in one line and listed by `spec check --todo`. Only errors fail the check. In merge mode (`spec check --merge`, CHECK-15), unapproved items become errors. The done gate (CHECK-11) will make missing verification an error for the requirements a change touches.
  after:
    title: Missing verification, missing approvals and unserved needs are to-dos, not errors
    decision: They're reported as to-dos, summarized in one line and listed by `spec check --todo`. Only errors fail the check. In merge mode (`spec check --merge`, CHECK-15), unapproved items become errors. The done gate (CHECK-11) will make missing verification an error for the requirements a change touches. A need that no requirement serves yet is a to-do too, so needs can be recorded before the requirements that serve them, as spec-first planning does (round 12).
  acks:
    DR-31: the decision stands for verification and approvals; this adds unserved needs to the to-dos, so it needs your permission and re-approval.
