  reason: records the restructure.
  after:
    title: The skill is a router over task-sized references
    decided_by: agent
    elements:
    - AGENT
    - ONBOARD
    requirements: AGENT-65, ONBOARD-8, ONBOARD-9, ONBOARD-10, ONBOARD-11
    context: In a trial, three agents onboarded copies of a nine-app repository with the skill. Each read every reference in full, needed none of the review, feedback and lock material, and still read the toolkit's source to learn field names. They diverged most on requirement depth (226 to 445 requirements for the same code) and on how honestly they reported coverage.
    decision: SKILL.md keeps the loop, levels of intent, capturing intent and editing, and opens with a table naming each reference, the task that needs it and its size. Review, feedback, locks and conflicts move to references/review-and-locks.md; every kind's fields move to a new references/schema.md with block-style examples. The onboarding reference becomes a checklist with a preflight, an altitude rule, a build order, a partly-met rule and affordable ways to run every check. Long references open with their contents, and none links to another.
    alternatives: Keeping one long SKILL.md, which agents read in full for every task. Splitting onboarding into its own skill, which would duplicate the editing and intent rules.
    consequences: An agent changing code reads about 100 lines; an onboarding agent reads about 250. Tests hold the layout to Anthropic's skill-authoring guidance.
    basis: derived
