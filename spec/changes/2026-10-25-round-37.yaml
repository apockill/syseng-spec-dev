- id: D2
  question: Should the toolkit keep the spec in a visible spec/ folder at the repository root, or in a hidden .spec/ folder like .git/ and .github/?
  importance: |-
    The spec's folder name is fixed today: the toolkit, its hooks and its file guard all look for spec/. People are meant to read the spec through the review page and agents' reports, and agents through the `spec` command, so the YAML files themselves are rarely read by hand. The trial showed a concrete risk: in the sites repository every top-level folder is served as a website at <folder>.alexthiele.io, so a spec/ folder would likely have been published at spec.alexthiele.io, with names, emails and security findings in it. Most web servers and static-site tools skip hidden dot-folders by default. Changing the name later means migrating every repository that uses the toolkit, including this one.
  involves: []
  options:
  - label: .spec/ for new repositories; existing spec/ folders keep working
    recommended: true
    detail: |-
      `spec init` creates .spec/. The toolkit, hooks and guard look for .spec/ first and then spec/, so this repository and any already set up need no migration, and can move with one `git mv` whenever you like. Matches your view of the spec as configuration read through tools, and avoids accidental publishing. GitHub still shows .spec/ changes in pull requests.
  - label: Keep spec/ as the default and make the location configurable
    detail: Nothing changes by default; `spec init --spec-dir .spec` (or any path) is recorded in the repository, and every tool follows it. Repositories like sites must remember to choose differently.
  - label: Move everything to .spec/
    detail: One name everywhere; this repository and every other one migrate now. Simplest long-term, most churn today.
  status: resolved
  chosen: Keep spec/ as the default and make the location configurable
  words: Alex Thiele <alex.g.thiele@gmail.com> chose Keep spec/ as the default and make the location configurable on the review page (summary)
  resolved: '2026-10-25'
  by: Alex Thiele <alex.g.thiele@gmail.com>
- id: D3
  question: When an agent drafts the spec from existing documents (a README, design notes, commit messages) rather than from what you said, how should the spec show that the intent was read, not heard?
  importance: |-
    Every item records how directly a person asked for it: explicit (you locked it), stated (you said it), guided (your choice fixed it), derived or added (an agent's). This decides what an agent may change without asking you. In the trial, each agent recorded about 40 items as your guided intent, read from documents that an agent account had written, with the documents' dates. Three real examples: (1) DESK-1, "Set as a hard rule that the desk light and the projector are never on together", read from code comments that credit the rule to you; probably right. (2) ARM-29, "finds holding for long periods fine and wants to know how long the arm can hold … called that a test in itself", reconstructed from an agent's design note; plausible but second-hand. (3) BOX-9, "a flag given as a dash takes its value from stdin … so secrets stay out of argv", read from a README section an agent wrote; a feature description, not something you said. Today the toolkit can't tell these apart from things you said in a conversation. This mostly affects migrations: in normal spec-first or code-first work, intent comes from talking with you.
  involves:
  - AGENT-68
  options:
  - label: Mark where each intent record came from
    recommended: true
    detail: |-
      Intent records gain `source: conversation` (the default) or `source: document` with the file and its author. Document-sourced records count as guided at most, appear in their own group on the review page ("read from documents, please confirm"), and a single confirmation turns them into yours. Items an agent read from its own documents become derived instead. Small change to the record format, the checker and the page.
  - label: A new intent level below guided
    detail: Add a "documented" level that never counts as your intent until you confirm it. Clearer in the level legend, but a sixth level everyone has to learn, and it mixes where intent came from with how strong it is.
  - label: Leave it to the context text
    detail: The updated skill already tells agents to name the document and its author in each record's context. Nothing in the toolkit changes; the page still shows these as your guided intent, so you'd have to read each one.
  status: resolved
  chosen: Mark where each intent record came from
  words: Alex Thiele <alex.g.thiele@gmail.com> chose Mark where each intent record came from on the review page (summary)
  resolved: '2026-10-25'
  by: Alex Thiele <alex.g.thiele@gmail.com>
- id: D4
  question: Should the skill guide how detailed requirements are with judgment rules (below) instead of mainly with a count per system element?
  importance: |-
    The three trial agents wrote 226, 345 and 445 requirements for the same code. Around two in five contained tuning constants, for example "wait 0.3 seconds and repeat the power-off up to 6 times", where the requirement you'd care about is "confirm the arm reads unpowered, and raise an alarm when it doesn't". You raised the core issue: the spec should grow with what you need and decide, not with code size. A static site and a site with elaborate motion graphics may meet the same needs with 1,000 versus 100,000 lines; the spec should differ by a requirement or two, so that "tone the motion down" changes one requirement while the code changes completely. The updated skill now says "one requirement per behaviour something relies on, constants out, about 5 to 15 per element, split past 30". The proposed rules: (1) Substitution test: if only today's implementation could satisfy it, it's too deep. (2) Pivot test: what would survive a plausible change of mind is a requirement; what wouldn't is design, recorded as a decision. (3) Count what a user or another part of the system can observe and would treat differently (modes, states, failures), not code branches; a black-box acceptance scenario per distinction is a good proxy. (4) Depth follows risk: safety limits and irreversible actions get exact numbers; a dashboard's refresh rate doesn't. (5) Counts per element are only a smoke alarm, never a target.
  involves:
  - ONBOARD-9
  options:
  - label: Adopt the five rules; keep counts only as a smoke alarm
    recommended: true
    detail: The writing-requirements reference leads with rules 1 to 4 and a few before/after examples; onboarding points to it. The 5-15-per-element figure stays as a warning sign. Auditors check new requirements against the substitution and pivot tests.
  - label: Keep the current count-based guidance
    detail: Simpler to follow, but it ties spec size to how the code happens to be split, which is the coupling you want to avoid.
  - label: Adopt the rules and add a checker warning for constants
    detail: Same as the first option, plus a to-do from `spec check` for any requirement containing a number with a unit the engineer didn't state. Catches the commonest slip mechanically, at the price of some false alarms on legitimate limits.
  status: open
friction: []
