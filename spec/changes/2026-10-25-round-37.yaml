decisions:
- id: D1
  question: When an agent brings an existing project into the spec method ("onboarding"), should it run every check the toolkit has, as ONBOARD-3 records you asking for, or a smaller, fixed set?
  importance: |-
    This sets how long and how expensive every onboarding is, and how much of what it reports as verified is real. Background: besides the project's own tests and the mechanical `spec check`, there are two expensive kinds of check. Auditors are fresh agents that compare the spec with the code and report mismatches. Reasoning checks are verification items judged by a model reading the code against a prompt. Reasoning checks are only half built: the toolkit has no command that runs them or records their verdicts, so agents start a helper agent by hand for each one, and a check nobody ran still counts as coverage today. In the three-agent trial on the sites repository, one agent ran 3 of its roughly 100 reasoning checks yet reported 100% coverage; another ran 19 checks and 9 auditors, using about 30 helper agents and roughly a sixth of a 5-hour usage window. The auditors found the most valuable results of the whole trial: committed private keys, a path traversal in the app template, and robot-arm safety gaps. In round 5 you asked for onboarding to be the "kitchen sink" (ONBOARD-3).
  involves:
  - ONBOARD-3
  options:
  - label: Keep every check, run efficiently, and build the runner next
    recommended: true
    detail: |-
      ONBOARD-3 stays as you stated it. The updated skill already batches the work: one helper per system element runs all of that element's reasoning checks, and each auditor kind runs once per element instead of once per item. Next, build `spec verify` so the toolkit itself runs reasoning checks, records each verdict, and counts only checks that ran as coverage. Cost: an onboarding of a repository like sites stays a long, expensive run.
  - label: A fixed budget
    detail: Onboarding runs the system-level and safety-related reasoning checks plus one drift and one conformance audit per element; everything else is reported honestly as not yet verified. Roughly half the cost, with gaps listed rather than closed. ONBOARD-3 would change, so this needs your confirmation.
  - label: Pause the question until the runner exists
    detail: Build `spec verify` first and decide afterwards, with real numbers on what a full run costs. Until then, onboardings follow the current skill.
  status: withdrawn
  withdrawn_because: |-
