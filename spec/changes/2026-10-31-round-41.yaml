decisions:
- id: D1
  kind: conflict
  question: Should the toolkit stop running tests itself and only read their results, which changes SYS-12 and SYS-13, requirements you locked?
  importance: This is the design's foundation. Today's spec describes a built-in runner, which was never built. You've now said the toolkit shouldn't take over the test runner's job, and that reverses items you locked or stated, so it needs your explicit choice. Everything else in this round depends on it.
  involves:
  - SYS-12
  - SYS-13
  - VERIFY-3
  - VERIFY-4
  - INTEG-1
  - LANG-2
  - CHECK-4
  options:
  - label: Read results; the project's own pipeline runs the tests
    recommended: true
    detail: |-
      The test tools or CI run the tests, and spec results reads what they report. What changes: SYS-12 and SYS-13 say verification runs when the engineer's pipeline runs it, and the toolkit reports on it. VERIFY-3 (run in parallel) and INTEG-1 (run declared commands) are removed, because that becomes the pipeline's job. VERIFY-4 becomes reporting from results. LANG-2 (C++ and Python adapters), with the requirements under it, gives way to result readers. CHECK-4 keeps checking links that name a file; other links are checked against results. Example: pytest in CI, then spec results add, then spec results status. Reasoning checks are unaffected: agents still run them, and their verdicts arrive as results.
    keeps:
    - SYS-12
    - SYS-13
    - VERIFY-3
    - VERIFY-4
    - INTEG-1
    - LANG-2
    - CHECK-4
  - label: Do both - read results, and also keep a built-in runner on the roadmap
    detail: |-
      Results come in as above, and the runner requirements stay as a future plan. Your locks stay intact, but the spec keeps about 15 requirements for something you've said you don't want, and they stay in the unverified count. Example: a later agent reads VERIFY-3 and builds a parallel runner.
    rolls_back:
    - SYS-12
    - SYS-13
    - VERIFY-3
    - VERIFY-4
    - INTEG-1
    - LANG-2
    - CHECK-4
  status: open
- id: D2
  question: Where should recorded test results be kept?
  importance: Results arrive from several pipeline steps and must survive until the final status command. Where they live decides whether results are shared between people and machines, and whether they clutter version control. It needs settling before the command is built.
  involves:
  - VERIFY-17
  options:
  - label: A folder ignored by version control, which CI can point elsewhere
    recommended: true
    detail: |-
      Results go in a folder such as .syseng/results/, one file per implementation, revision and step, and a --results-dir option moves it. CI jobs on separate machines share a folder or pass it along as a build artifact. Nothing is committed, so results cause no merge conflicts or noise in pull requests. What follows: a fresh clone starts with no results, so status says not yet run until a pipeline's results are fetched.
  - label: Commit the results in the repository
    detail: |-
      Everyone sees the same results after a pull, and history keeps them. But every test run changes committed files, so branches conflict constantly, and CI must commit back to the repository. Example: two pull requests both touching a results file on every run.
  status: open
- id: D3
  question: What should make the final status command fail a CI pipeline?
  importance: This decides how strict the toolkit is in a pipeline. Too strict blocks work on results nobody could have produced yet; too loose lets real failures pass. The exit code is what CI acts on.
  involves:
  - SYS-57
  options:
  - label: Fail only when a verification item is failing
    recommended: true
    detail: |-
      A failed linked test fails the pipeline. Items not yet run or not implemented are listed as to-dos and don't fail it. This suits a migration: a second implementation that's in progress shows many not-implemented items without turning CI red. An option could tighten it later.
  - label: Also fail when an item that verifies a locked requirement hasn't been run
    detail: |-
      Stricter protection for what you locked: the pipeline fails unless those items have results. But any repository with a skipped step, or with expensive steps that run nightly, fails on ordinary pull requests unless older results count, so this one needs tuning per project.
  status: open
