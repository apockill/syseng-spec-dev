- op: add
  id: DR-68
  at: 2026-10-21T15:37-07:00
  reason: records the decay the engineer agreed to.
  after:
    title: A lock or intent record on a changed item decays one level, and seeing the change counts as an answer
    decided_by: engineer
    elements:
    - CHECK
    - REVIEW
    requirements: CHECK-28, CHECK-19, CHANGE-14, REVIEW-20
    recorded: round 26
    context: An item locked and then changed stayed explicit forever, asked about on every review page and reported as a to-do every run, until the person pressed Keep. The engineer wanted not answering to be acceptable, with the lock decaying a bit so it's clear the wording moved without their agreement.
    decision: |-
      - When an item changes after its newest lock or intent record and nobody keeps it, that record counts one level lower: a lock as stated, stated as guided, guided as derived. The page marks the item as locked to (or stated or guided for) an earlier version.
      - Once a review the person sent back has shown the change, it leaves what awaits them and stops being a to-do. The mark stays.
      - Keeping it restores the full level; rolling it back makes the record match again. A further change while already decayed doesn't decay it further.
    alternatives: Keeping the full level until answered, which nags forever. Dropping the lock entirely, which loses that the person once locked it. Decaying with time, which says nothing about whether they saw the change.
    consequences: A stale lock still protects the item as stated intent, so a conflicting change still comes back to the person. The review page shows each changed item once, however many rounds changed it.
