- op: add
  id: DR-50
  at: 2026-10-17T23:26-07:00
  reason: design decision of round 14.
  after:
    title: Test links are checked by reading files, not by running tests
    decided_by: agent
    elements:
    - CHECK
    - LANG
    requirements: CHECK-4
    recorded: round 14
    context: Before a first real project, the engineer asked for a simple check that linked tests exist, with everything else scoped later.
    decision: |-
      The checker confirms each link by reading the source: the file exists and, when the link names a test, the file declares it. That's a pytest function, with its class if given, or a GoogleTest declared with TEST, TEST_F, TEST_P or TYPED_TEST. Any other file only has to mention the name. Links resolve against the implementation's root, and `spec edit` checks them against the real repository rather than its scratch copy.
    alternatives: |-
      Asking pytest and the test binary to list their tests, which needs a built project and is slow. Checking only that the file exists, which misses the commonest error: a renamed or misspelled test.
    consequences: Listing tests no verification item links to (CHECK-3), the rest of the language adapters (LANG-3) and running tests stay unbuilt until a real project shows what they need. A test generated by a macro other than these isn't recognized.
