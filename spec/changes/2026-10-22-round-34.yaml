  reason: the engineer pointed out DR-45 still spoke of approvals; it now describes locks.yaml as built, including the amendments of DR-55 and DR-62 its status already noted.
  before:
    title: Approvals are kept as a history, each with who and how
    context: The approvals file held one record per item, so approving again overwrote the earlier record and its words. SYS-33 asks what an approval says about who and how, and SYS-39 asks for history.
    decision: Every approval is appended, never replaced, and each records the approver, the channel (terminal, chat, menu, page or restated), the date and time, how many items were approved together, the engineer's words, an optional note, and the resolved decisions that involved the item. An item's current approval is any record whose fingerprint matches its content, the latest one first.
    alternatives: One record per item with a list of past approvals inside it, which makes the file harder to read in a diff. A separate history file, which splits what one approval means across two places.
    consequences: The approvals file grows with every approval. Records from before round 12 lack the new fields, and the toolkit treats the missing fields as unknown.
  after:
    title: Locks are kept as a history, each with who and how
    context: The approvals file, as locks were stored before round 18, held one record per item, so locking again overwrote the earlier record. SYS-33 asks what a lock says about who and how, and SYS-39 asks for history.
    decision: Every lock is appended to locks.yaml, never replaced, and each records the person, the channel (terminal, chat, menu or page), the date and time, how many items were locked together, an optional note, the resolved decisions that involved the item, and, when an agent records it, a summary of what the person said. An unlock is a record of its own, so the history stays append-only. An item's current lock is the latest record whose fingerprint matches its content, unless a later record released it.
    alternatives: One record per item with a list of past locks inside it, which makes the file harder to read in a diff. A separate history file, which splits what one lock means across two places.
    consequences: locks.yaml grows with every lock. Records from before round 12 lack the newer fields, and the toolkit treats the missing fields as unknown.
- op: modify
  id: DR-44
  at: 2026-10-22T16:02-07:00
  reason: the engineer asked why DR-45 still said approval; this decision used the same retired word for the same act.
  raised:
  - a person locked it
  level: explicit
  fingerprint_before: 2a58655c60ad
  fingerprint_after: a0c3dcbae9f1
  rewording: true
  before:
    title: Approval works like delegated authority in configuration management
    context: The engineer wants to approve the key points of the requirement tree, let agents decide the rest, and have each later change to what they approved, wrote or decided brought back to them (NEED-14 to NEED-20). Today every item needs approval, and over 200 items are waiting.
    decision: |-
      Approval follows the split configuration management makes between a customer and a contractor (MIL-HDBK-61A, for example).
      - The engineer approves key items explicitly, as a customer approves a baseline. Everything beneath an approved item is delegated: the agent decides it, as a contractor decides the detailed design.
      - A change that alters an item the engineer approved, wrote or decided is like a Class I change: it goes back to the engineer once built and tested (SYS-37). Any other change is like a Class II change: the agent decides, and the change record logs it.
      - Whether an item is approved, delegated or neither is computed from the approvals and the tree each time it's shown, and never stored (SYS-40).
      - Where a requirement sits and whose words it carries are separate, as INCOSE keeps "trace to parent" apart from "trace to source": the system's structure places it (SYS-36), and it quotes the engineer's words it expresses (SYS-35).
    alternatives: Approving every item, which is today's rule and doesn't scale. A stored importance score, which the engineer ruled out.
    consequences: The engineer approves a few key items per change instead of every item. Agents need each item's approval state at the moment they change it (SYS-39). The merge check never blocks; it lists the alterations the engineer hasn't answered yet (CHECK-15, round 12 D1).
  after:
    title: Locking works like delegated authority in configuration management
    context: The engineer wants to lock the key points of the requirement tree, let agents decide the rest, and have each later change to what they locked, wrote or decided brought back to them (NEED-14 to NEED-20). Back then every item needed approval, and over 200 items were waiting.
    decision: |-
      Locking follows the split configuration management makes between a customer and a contractor (MIL-HDBK-61A, for example).
      - The engineer locks key items explicitly, as a customer approves a baseline. Everything beneath a locked item is delegated: the agent decides it, as a contractor decides the detailed design.
      - A change that alters an item the engineer locked, wrote or decided is like a Class I change: it goes back to the engineer once built and tested (SYS-37). Any other change is like a Class II change: the agent decides, and the change record logs it.
      - Whether an item is locked, delegated or neither is computed from the locks and the tree each time it's shown, and never stored (SYS-40).
      - Where a requirement sits and what the engineer said that it expresses are separate, as INCOSE keeps "trace to parent" apart from "trace to source": the system's structure places it (SYS-36), and its intent records carry what the engineer said (SYS-35).
    alternatives: Locking every item, which was the rule then and doesn't scale. A stored importance score, which the engineer ruled out.
    consequences: The engineer locks a few key items per change instead of every item. Agents need each item's lock state at the moment they change it (SYS-39). The merge check never blocks; it lists the alterations the engineer hasn't answered yet (CHECK-15, round 12 D1).
  acks:
    DR-44: |-
      a rewording: approval becomes lock, at the engineer's request on DR-45; the meaning is unchanged, and they re-lock it on the page
