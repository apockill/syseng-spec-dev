- op: add
  id: DR-49
  at: 2026-10-17T22:53-07:00
  reason: design decision of round 13.
  after:
    title: Review sections carry their context inline instead of linking to it
    decided_by: agent
    elements:
    - REVIEW
    - CHANGE
    requirements: REVIEW-18, REVIEW-19
    recorded: round 13
    context: In round 12's record the engineer had to search for each proposed item's full text and scroll back. They read change records as raw Markdown in the editor, where links show no preview on hover.
    decision: |-
      Wherever the change record asks the engineer to approve or answer for an item, it repeats what's needed to judge it right there: the full text, what it sits under, its rationale and the engineer's words; for a decision record, its reasoning and the full text of the requirements it decides. The other IDs the shown text mentions are listed with their titles.
    alternatives: Linking each ID to its item with the text on hover, which only works in a Markdown preview. A glossary at the end of the record, which still means scrolling.
    consequences: Change records get longer, and the same text can appear in two sections. Each review section can be read on its own.
- op: modify
  id: DR-41
  at: 2026-10-17T22:53-07:00
  reason: the engineer's "Change 13 LGTM." would have been read as approving nothing.
  before:
    decision: |-
      The prompt hook reads each line of the engineer's message on its own. A line approves when it starts with "approve" (or "approved") and its first clause names only item IDs and ranges, or when it is only item IDs followed by "LGTM", "approved" or "looks good", as in "SYS-32 LGTM".
      - It records the whole message as the engineer's words, marked as given in chat, and tells the agent what it recorded.
      - Any other approval, such as "approve everything except the wording ones", records nothing. The hook tells the agent to show the exact list, leaving out every item an exception could refer to, and to get the engineer's confirmation, in a menu where the harness has one.
      - Quoted lines and pasted text never count, and a capitalized word counts as a system element only when that element exists. A message with "lgtm" or "looks good" and no IDs gets a note that it approves nothing.
  after:
    decision: |-
      The prompt hook reads each line of the engineer's message on its own. A line approves when it starts with "approve" (or "approved") and its first clause names only item IDs and ranges, or when it is only item IDs followed by "LGTM", "approved" or "looks good", as in "SYS-32 LGTM".
      - An ID may be written as a word and a number, such as "Change 13", when the word names a system element, needs or decision records (AGENT-57).
      - It records the whole message as the engineer's words, marked as given in chat, and tells the agent what it recorded.
      - Any other approval, such as "approve everything except the wording ones", records nothing. The hook tells the agent to show the exact list, leaving out every item an exception could refer to, and to get the engineer's confirmation, in a menu where the harness has one.
      - Quoted lines and pasted text never count, and a capitalized word counts as a system element only when that element exists. A message with "lgtm" or "looks good" and no IDs gets a note that it approves nothing.
decisions:
- id: D1
  question: Which of an agent's decision records should be proposed for your explicit approval?
  importance: It decides how many decision records land in front of you each round. Right now AGENT-51 proposes every record that weighed alternatives, which is nearly all of them, and that's how DR-45, DR-47 and DR-48 reached you in round 12.
  involves:
  - AGENT-51
  options:
  - label: Only those whose consequences reach you
    recommended: true
    detail: |-
      Propose an agent's decision record only when it changes what you see, approve or do: DR-47 (approving a need delegates what's under it) qualifies, DR-45 (how approval history is stored) doesn't. The rest stay recorded and delegated: future agents read them as reasoning and may revise them, recording why.
  - label: Every record that weighed alternatives
    detail: Today's rule. Nothing slips past you, at the cost of reading mechanics like DR-45 and DR-48.
  - label: Never
    detail: Agent decision records stay as memory only. Choices that matter to you would have to surface as requirements or open decisions instead.
  status: resolved
  chosen: Only those whose consequences reach you
  words: Alex Thiele <alex.g.thiele@gmail.com> chose Only those whose consequences reach you on the review page (summary)
  resolved: '2026-10-21'
  by: Alex Thiele <alex.g.thiele@gmail.com>
