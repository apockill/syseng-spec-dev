    description: |-
      With a closed round and an open one: a decision is found as change/D-number or by part of the change's ID, and a bare number open in both rounds is refused; the status lists the earlier round's open decisions by those names. Withdrawing one from the open change keeps its question and options, records why and where, logs it in the open change, and drops it from what the page and status show awaiting. Replacing one files the new decision in the open change, naming what it replaces, and withdraws the old one. A withdrawn decision takes no choice. A lock proposal is withdrawn only with a reason, keeps its items and reason, leaves the proposals and the status, can't be withdrawn twice, and can be proposed afresh.
