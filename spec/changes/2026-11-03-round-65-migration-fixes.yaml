  question: REVIEW-41 (with no base named, the review page compares against the trunk) now has an exception. In a repository that commits straight to the trunk, the trunk's base is the current commit, so the page showed 0 items changed (all 5 agents onboarding the web-apps folder on 2026-11-03 hit this). There the page now compares against your last review, or before your first one, the commit before the newest change started, and says why at its top. REVIEW-41 is narrowed to say the trunk applies when its base isn't the current commit. Keep the change?
