  kind: comment
  comment: "And it should be friendly to LLMs by reporting up the REQ tree. The goal here being to surface possibly broken requirements for the LLM. \n\nLLM: sees failing test, and only sees failing ver: maybe it fixes just the VER\nLLM: sees failing VER, and also gets contextual information (all parent REQ text, or maybe all locked REQs along the chain). This sparks a realization that an important req has broken, and perhaps that this implementation should require changing reqs or changing tact, and possibly flags things to user.\n\nThe latter is preferred, I'd think. Of course, we still want to be token efficient where possible, so its all about pulling in relevant information."
  response: |-
    Built: each failure in spec results status now shows what the item checks, the requirement it verifies, and the explicit and stated items above it, each text once, with a reminder that a broken direction is a conflict to raise. Derived items stay out to save tokens, --full-trace adds them, and --json gives the same data. Your choice of locked versus all parents is therefore both, with stated included because it's also your direction.
  responded: 2026-10-31T14:48-07:00
