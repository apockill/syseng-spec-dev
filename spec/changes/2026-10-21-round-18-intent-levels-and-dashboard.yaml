    origin: engineer
    source: |-
      Alex Thiele, 2026-10-21 (summary): everything shown on the review page should also be available to agents, so the conversation flows freely while they ask questions and ask for changes. Wants a spec diff command so agents can read differences in a form that suits them, built on the same library as the page.
    context: Agreeing to how the spec diff would work.
- op: add
