      - A request without conflicts is built without stopping, in code-first mode as before. Alterations to guided items are still asked about once built.
  after:
    decision: |-
      - A request conflicts with an item when it can't be met without changing that item's meaning, or when it makes the item impossible to meet.
      - Before building, the agent compares the request with the explicit and stated items in the elements it affects, in the elements that depend on those, and above them in the trace (AGENT-61). The usual way is to draft the request's spec edits first, because the edit's context shows each affected item's level. A conflict found mid-build is raised then, before more is built.
      - A conflict becomes an open decision that names the conflicting items and offers options (reword, edit, add, change, or drop part of the request), one recommended, each showing the new text it would give the items. It heads the review page, and the agent says in chat that it's there, with enough to answer in chat.
      - The CLI refuses an edit that changes the text of an explicit or stated item unless the edit names a conflict a person resolved for that item, adds the person's own request for the change as an intent record, or is declared a rewording. A declared rewording is shown on the review page as one, for the person to check. It's a guardrail against forgetting, not a security boundary.
