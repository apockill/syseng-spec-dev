- op: add
  id: DR-54
  at: 2026-10-21T12:22-07:00
  reason: records the levels the engineer agreed to.
  after:
    title: Five levels of intent, computed from locks, intent records and a recorded basis
    decided_by: engineer
    elements:
    - SYS
    - MODEL
    - CHECK
    - REVIEW
    - AGENT
    requirements: SYS-42, MODEL-37, MODEL-38, CHECK-18, REVIEW-16, AGENT-60
    recorded: round 18
    context: Approval gave items two states that matter, approved or delegated, and an item the engineer stated in conversation showed as unreviewed unless they approved it by ID. The engineer wants agents to build fast while recording how directly a person asked for each item, using agent judgment, with anything they say they want locked at some level.
    decision: |-
      Five levels, highest first:
      - **explicit:** a person locked it by name, on the review page, in chat or in the terminal. A lock record, as approvals are today.
      - **stated:** a person asked for this item. An intent record with the basis stated.
      - **guided:** a person shaped it without asking for it, for example by choosing an option, reacting to a demo, or giving a constraint it follows from. An intent record with the basis guided.
      - **derived:** something above it needs it, and no person addressed it. The basis derived.
      - **added:** an agent's own idea, which nothing a person asked for needs. The basis added.

      An item takes its highest level. An explicit, stated or guided item shows as changed once its content differs from what its lock or intent record was given for. Levels are computed each time and never stored. Choosing stated or guided, and derived or added, is the agent's judgment when it records the item, and the review page shows each one for correction.

      The basis records how an item came about, not how much it matters, so SYS-40 holds: agents still weigh dates, edit counts and discussions for themselves.

      What each level means for a later change: a conflict with an explicit or stated item is raised before building (DR-57); an alteration to a guided item is asked about once built (SYS-37); derived and added items are changed freely, and the change is logged.
    alternatives: Two states, approved and delegated (DR-44 alone), which can't tell what a request needed from what an agent added. A stored level field, which says nothing about who or when. A numeric score, which the engineer ruled out (SYS-40).
    consequences: Every requirement and decision record carries a basis or an intent record; for this repository the migration supplies them (DR-61). Verification items count as derived and carry no basis. DR-44's delegation remains, as the item a derived or added item names above it.
- op: add
  id: DR-55
  at: 2026-10-21T12:22-07:00
  reason: records how the engineer asked for their words to be kept.
  after:
    title: Intent records summarize what a person said, with author and context, and never quote it
    decided_by: engineer
    elements:
    - MODEL
    - CHECK
    - REVIEW
    - AGENT
    requirements: SYS-35, MODEL-34, MODEL-36, MODEL-37, CHECK-20, REVIEW-17, AGENT-53, AGENT-54
    recorded: round 18
    context: Items kept the engineer's words verbatim, in quotes lists (DR-46) and in older source fields, and approval records kept their words too. The engineer doesn't want unreviewed conversation committed word for word to a public repository, but does want a reader to see how far a person specified something and what they left open.
    decision: |-
      Each item takes an intent list. Each record holds:
      - **by:** the person's name and email address (DR-56);
      - **when:** the date and time of the statement;
      - **context:** the agent's account of what was being discussed and what prompted the statement;
      - **said:** a close summary of what the person said, lightly cleaned up and in the third person. It keeps their hedges and strength, such as probably or must, adds no number or mechanism they didn't give, and says what they left open when they said so;
      - **basis:** stated or guided (DR-54);
      - a fingerprint of the item as it was, filled in by the CLI.

      Quotation marks aren't allowed in these fields. Lock records and change-log reasons summarize in the same way. The migration summarizes the existing verbatim text (DR-61).
    alternatives: Keeping the verbatim words (DR-46), which publishes conversation. Keeping verbatim words outside the repository with a summary inside, which needs storage every machine and person shares.
    consequences: A summary is the agent's reading, so its fidelity is checked by auditors and by the person on the review page, not by the checker. Version-control history still holds the verbatim text committed before the migration. Removing it means rewriting history, which is the engineer's call.
- op: add
  id: DR-56
  at: 2026-10-21T12:22-07:00
  reason: SYS-43 on a machine where an agent commits.
  after:
    title: A person's identity comes from a toolkit setting, then from version control's user
    decided_by: agent
    elements:
    - CLI
    - MODEL
    requirements: SYS-43, CLI-11
    recorded: round 18
    context: Every intent record and lock names its person (SYS-43). On the engineer's machine, version control's user is the agent's own account, while the engineer's commits carry their name.
    decision: The CLI reads the person from a toolkit setting in version control's configuration, set per machine and per person and never committed, then from an environment variable, then from version control's user name and email address. Setup asks for the setting when it's missing, and the status command shows who is recorded.
    alternatives: Version control's user only, which credits the agent on machines where the agent commits. A list of people kept in the spec, which every person would have to maintain.
    consequences: On a machine where an agent commits under its own account, a missing setting attributes intent to the agent. Setup's question and the status line are what prevent that.
- op: add
  id: DR-57
  at: 2026-10-21T12:22-07:00
  reason: records the conflict flow the engineer described.
  after:
    title: A conflict with an explicit or stated item is raised before building, and the edit is refused until it's resolved
    decided_by: engineer
    elements:
    - AGENT
    - CHANGE
    - CLI
    requirements: SYS-49, SYS-18, CHANGE-17, CHANGE-18, CLI-22, AGENT-61
    recorded: round 18
    context: Under DR-15 a code-first change finishes and reports, and SYS-37 asks about alterations once they're built. The engineer wants requests that conflict with nothing built without interruption, and a request that conflicts with earlier intent answered with the conflict, the requirements involved, and ways to reword, edit, add or change items. They prefer conflicts shown on the review page, and left the agent-side tooling to the agent.
    decision: |-
      - Before building, the agent compares the request with the explicit and stated items in the elements it affects. The usual way is to draft the request's spec edits first, because the edit's context shows each affected item's level.
      - A conflict becomes an open decision that names the conflicting items and offers options (reword, edit, add, change, or drop part of the request), one of them recommended. It heads the review page, and the agent says in chat that it's there, with enough to answer in chat.
      - The CLI refuses an edit that changes the meaning of an explicit or stated item unless the edit names a resolved conflict. Edits that change only wording pass.
      - The alterations the chosen option makes count as kept, and the answer is itself stated intent on the items it produces.
      - A request without conflicts is built without stopping, in code-first mode as before. Alterations to guided items are still asked about once built.
    alternatives: Asking after building, as DR-15 and SYS-37 do, which builds on a reading the engineer may reject. A separate impact command listing the locked items in scope before any edit, which was dropped because the edit context already shows them and only the edit says what the request changes.
    consequences: DR-15 is amended. An agent that skips the comparison is still stopped by the refusal when it edits the item, though possibly after writing code.
- op: add
  id: DR-58
  at: 2026-10-21T12:22-07:00
  reason: records the engineer's choice of flow-down.
  after:
    title: Requirements flow down the system breakdown
    decided_by: engineer
    elements:
    - SYS
    - MODEL
    - CHECK
    requirements: SYS-50, CHECK-22
    recorded: round 18
    context: All 181 element requirements traced straight to a system requirement, including those of VERIFY's children, so the requirement tree was one level deep and crossed the element tree. DR-22 allowed a system requirement to be allocated directly to any element. The engineer said flow-down along the system breakdown was their original intent.
    decision: A requirement on an element refines a requirement of the element's parent, and an element directly under the system refines a system requirement. Intermediate elements get requirements of their own for their children to refine, and MODEL-33 still forbids restating. The checker reports violations as to-dos until the migration (DR-61) has re-traced this repository, and as errors after it.
    alternatives: Direct allocation (DR-22), which keeps the requirement tree shallow and the graph tangled.
    consequences: DR-22 is superseded on allocation, and its rule against restating holds. The review page's graph can draw one tree.
- op: add
  id: DR-59
  at: 2026-10-21T12:22-07:00
  reason: records the diff design the engineer agreed to.
  after:
    title: One library builds the comparison and every page section, for the CLI and the review page alike
    decided_by: engineer
    elements:
    - DIFF
    - CLI
    - REVIEW
    - MODEL
    requirements: SYS-47, SYS-48, DIFF-1, DIFF-2, DIFF-3, DIFF-4, DIFF-5, CLI-24, MODEL-39, REVIEW-24
    recorded: round 18
    context: The engineer wants a spec diff that agents can read, built so that the review page reuses it, and everything the page shows available to agents so that the conversation and the page can be used interchangeably.
    decision: |-
      - One library builds each section of the review page as data: decisions awaiting a person, differences, captured intent, proposals, the graph, and the items. The page embeds that data, and CLI commands print it as text or YAML.
      - The comparison reads the older spec at a version-control revision without touching the working tree. The newer side defaults to the working tree. Against a branch, it compares with the merge base.
      - Items are compared by ID: added, removed, moved, changed in meaning (by fingerprint) or in wording only. Each comes with the reasons from the change records the newer side adds, and its level on both sides.
      - A review sent back is recorded in the spec with its person, time, revision and the fingerprints shown. The page's embedded data, kept locally, gives the exact content shown. The comparison since a person's last review uses both.
    alternatives: Rebuilding differences from the change logs alone, which misses anything not made through the edit command and can't compare against an arbitrary revision. Separate code for the page and the CLI, which would drift apart.
    consequences: The toolkit now reads version control, which DR-48 avoided. A repository without version control can compare only against a review snapshot.
- op: add
  id: DR-60
  at: 2026-10-21T12:22-07:00
  reason: records the review page design the engineer agreed to.
  after:
    title: One self-contained review page replaces the Markdown views, and feedback comes back as a pasted block
    decided_by: engineer
    elements:
    - REVIEW
    - CLI
    - CHANGE
    - CHECK
    requirements: SYS-45, SYS-46, REVIEW-20, REVIEW-21, REVIEW-22, REVIEW-23, REVIEW-25, CLI-23, CLI-25, AGENT-62, CHANGE-19, CHECK-23
    recorded: round 18
    context: The engineer reviewed the spec in generated Markdown and change records, and wants a more powerful dashboard that can be iterated on, with the Markdown removed.
    decision: |-
      - One command writes a single HTML file, ignored by version control, with its data embedded and its scripts included. It loads nothing from the network.
      - Its sections follow REVIEW-20. The graph lays out the element tree with requirements nested inside, colored by level of intent.
      - Its controls lock, comment, request a change, keep or roll back an alteration, and choose an option in a decision. Unsent feedback stays in the browser.
      - Copying the feedback produces a block of text carrying the review's ID and the fingerprint of each item acted on. Pasted into the conversation, it's applied by the CLI, which records locks and choices mechanically, refuses stale ones, and records comments in the open change for the agent to answer. A block with nothing in it means reviewed, with nothing to add.
      - The requirements, decisions and change-record Markdown files are no longer generated.
    alternatives: A local server that receives feedback directly, which removes the paste step but needs a running process; it stays open as a later option. Keeping the Markdown alongside, which doubles what has to be maintained.
    consequences: Apart from the YAML, nothing in the repository reads well on a code host without running the toolkit. DR-28's generated views are superseded. The chat lock lines the prompt hook reads stay as a shortcut.
- op: add
  id: DR-61
  at: 2026-10-21T12:22-07:00
  reason: records the engineer's choice of one combined migration.
  after:
    title: Change meaning first, then migrate structure, intent and vocabulary in one pass
    decided_by: engineer
    elements:
    - SYS
    - MODEL
    - CHECK
    - AGENT
    requirements: SYS-35, SYS-42, SYS-50
    recorded: round 18
    context: The engineer asked for a migration away from the approval vocabulary, either first or as part of the flow-down migration.
    decision: |-
      - This round changes meaning only.
      - Phase 1 builds the tooling, reading old and new fields side by side.
      - Phase 2 migrates this repository element by element, touching each item once: re-trace it for flow-down, summarize its verbatim words into intent records with person and basis, turn its approvals into explicit locks, and rename the approval vocabulary to locks, and the engineer to a person where several people apply. The old fields and commands then go, and the checker rejects them.
      - Phases 3 to 5 build the comparison, the review page and the feedback loop.
    alternatives: A separate migration per concern, which touches each item two or three times and asks for a review each time.
    consequences: Until Phase 2 the spec mixes vocabularies, and this round's statements sit as summaries in the old source field.
