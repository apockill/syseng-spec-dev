request: Record how directly people asked for each item (lock levels, attributed intent summaries instead of verbatim quotes), raise conflicts with locked intent before building, flow requirements down the system breakdown, and replace the Markdown views with a review dashboard and a spec diff that agents can query too
mode: spec-first
target: python
status: closed
opened: '2026-10-21'
entries:
- op: modify
  id: NEED-16
  at: 2026-10-21T12:14-07:00
  reason: the engineer asked for summaries instead of verbatim quotes, attributed to their author.
  raised:
  - you approved it
  - it carries your words
  fingerprint_before: 46ebdf0af466
  fingerprint_after: 77395f576516
  before:
    text: The engineer needs their statements kept word for word on the requirements those statements directly express.
    source: |-
      [verbatim words removed when this spec moved to intent records]
    context: Discussing delegated requirements and where the engineer's words should be kept, then clarifying that not every requirement needs a quote.
  after:
    text: The engineer needs what people say about the product kept on the items it shapes as an attributed summary close to their words, never word for word.
    source: |-
      Alex Thiele, 2026-10-21 (summary): likes that the reasoning behind decisions is recorded, but is concerned about committing unreviewed verbatim quotes to a public repository. Wants instead an AI summary close to what was said, lightly cleaned up, with its author and the context of the discussion, so that a reader of the context and the summary can tell how far the person specified the thing and what they left unspecified. Wants a separation between the conversation and what is published.
    context: Revising round 12's choice to keep the engineer's words verbatim (DR-46), while planning the review page.
  acks:
    NEED-16: the engineer revised this need in this round; it awaits their answer on the review.
    SYS-35: rewritten to NEED-16's new wording; awaits the engineer's answer.
- op: add
  id: NEED-22
  at: 2026-10-21T12:14-07:00
  reason: the engineer's statement of the problem this round addresses.
  after:
    text: |-
      The engineer needs agents to build fast while recording how directly a person asked for each item: by name, in conversation, indirectly, or not at all.
    origin: engineer
    source: |-
      Alex Thiele, 2026-10-21 (summary): agents can build whole applications with many features in one pass, adding hundreds of thousands of lines, but nothing records which parts a person intended, which follow from the request, and which the agent added to be helpful. Code is a poor record of intent. Wants it recorded, with agent judgment on how directly each item was asked for, so that a large refactor reshapes what nobody asked for and brings what was asked for back to a person. Wants fast development that leaves concrete breadcrumbs of what was specified directly, less directly, or not at all, and agreed to five levels: explicit, stated, guided, derived, added.
    context: Describing the problem the toolkit solves, then settling the levels of intent.
- op: add
  id: NEED-23
  at: 2026-10-21T12:14-07:00
  reason: the engineer's journey for reviewing agent work.
  after:
    text: The engineer needs to review each round of agent work on one page that shows what people intended, what changed since their last review and which items most deserve locking in, and to send feedback from that page to the agent.
    origin: engineer
    source: |-
      Alex Thiele, 2026-10-21 (summary): describes the journey. They ask for an app in free form, with a few high-level needs and a few detailed requirements. The agent builds it and its spec, then offers a page to check. The page highlights what a person specified directly, shows an interactive graph of the requirement tree, and lists the items most useful to lock in. They comment on a few items and lock a few, copy the feedback back to the agent, and the agent adjusts the spec or code and regenerates the page. After the next feature the page also shows, readably, what changed. Wants the Markdown views removed in favor of this page.
    context: Setting out the user journey the toolkit should support.
- op: add
  id: NEED-24
  at: 2026-10-21T12:14-07:00
