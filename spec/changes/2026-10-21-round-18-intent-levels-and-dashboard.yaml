- op: add
  id: DR-62
  at: 2026-10-21T12:41-07:00
  reason: |-
    audit: the central decision of this round had no decision record.
  after:
    title: What a person says becomes intent without an approval step, and locks stay a person's own act
    decided_by: engineer
    elements:
    - AGENT
    - MODEL
    - REVIEW
    - CLI
    requirements: SYS-44, MODEL-37, AGENT-21, AGENT-50, AGENT-56, REVIEW-25, SYS-51, CLI-23
    recorded: round 18
    context: The engineer found approvals too prescriptive (typed lines, IDs, confirmations) and wants what they say in conversation locked in automatically, with the review page used for confirming. AGENT-48's typed line is removed in this round.
    decision: |-
      - When a person says what they want, in conversation or in a page comment, the agent adds an intent record to each item the words directly express: stated when the words alone say what the item requires, guided when the person's choice or constraint fixed it. A restatement of an existing item is a stated intent record, not an approval.
      - The review page shows what was captured since the person's last review, to correct or remove.
      - A lock (the explicit level) is a person's own act: a page control, the terminal, or a lock line in chat, which the prompt hook still reads as a shortcut.
      - Records made mechanically, by the prompt hook or from a feedback block, hold no words: the person, the channel, the IDs and the fingerprints.
      - A feedback block names its person and carries fingerprints. In a harness with the prompt hook, the hook applies a block the person pastes, as it does lock lines, so no agent interprets it; elsewhere the agent applies it with the CLI.
    alternatives: Keeping approval in chat by ID only (DR-41), which is the ritual the engineer wants gone. Letting the agent lock what a person says, which would make every captured remark explicit and leave the explicit level meaning nothing.
    consequences: A misreading by the agent becomes intent until the person corrects it on the page, so the captured-intent section matters. DR-6 and DR-41 are amended, and pasted text counts when it's a feedback block.
