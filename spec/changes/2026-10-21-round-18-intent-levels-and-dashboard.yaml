decisions:
- id: D1
  question: How far should the migration go in removing verbatim text already committed?
  importance: It sets the size of Phase 2 and how much of your past conversation stays in current files. Every change record's before and after values, and the approval words in the approvals file, hold your words verbatim, and this round's own change record copies some of them again. Version-control history keeps them whatever is chosen here.
  involves:
  - NEED-16
  - SYS-35
  - DR-55
  - DR-61
  options:
  - label: Summarize everywhere in current files
    recommended: true
    detail: Phase 2 also summarizes the verbatim text in past change records (their before and after values and reasons) and in the approval words. From then on nothing in the current tree quotes you. Removing it from history stays a separate choice of yours (rewriting history, or publishing a fresh squashed copy).
  - label: Summarize live items only
    detail: Items and approvals get summaries; past change records stay as written, as a historical log. Less work, but anyone reading the change records still sees your words verbatim.
  status: resolved
  chosen: Summarize everywhere in current files
  words: |-
    Alex Thiele (summary): migrate 100% to the new system; git keeps the history.
  resolved: '2026-10-21'
- id: D2
  question: When you paste a feedback block from the review page, who applies it?
  importance: It decides whether your locks from the page reach the spec without any agent interpreting them, and whether you see a permission prompt each time. It shapes DR-62 and how the prompt hook changes in Phase 5.
  involves:
  - SYS-51
  - CLI-23
  - DR-62
  - DR-41
  options:
  - label: The prompt hook applies it
    recommended: true
    detail: As with lock lines today, the Claude Code prompt hook recognizes the block in your own message and applies it with the CLI, then tells the agent what it recorded. No prompt, and no agent in between. In harnesses without the hook, the agent runs the apply command.
  - label: The agent applies it
    detail: The agent runs the apply command on the block you pasted, with a permission prompt in Claude Code (as for approving today). One more click, and the agent handles text that records your locks.
  status: resolved
  chosen: The agent applies it
  words: |-
    Alex Thiele (summary): the person pastes the block, so it can travel: a pull-request reviewer can post it as review notes on the PR, or an author can review their own change and paste it to the agent. The aim is system-level review in place of code review, since code will soon be too large for people to review.
  resolved: '2026-10-21'
- id: D3
  question: Does the stored basis sit within SYS-40 (no stored measure of importance), or should SYS-40 be amended?
  importance: Low impact on the build, but it's a requirement you approved, and the audit noted the tension. Levels are ordered and gate behavior (CLI-22 refuses edits to stated items), which is close to the classification SYS-40 ruled out.
  involves:
  - SYS-40
  - SYS-42
  - DR-54
  options:
  - label: Keep SYS-40 as is
    recommended: true
    detail: The basis records how an item came about (provenance), not how much it matters. Agents still weigh dates, edit counts and discussions themselves, and DR-54 says so.
  - label: Amend SYS-40 to name the exception
    detail: Reword SYS-40 to forbid stored importance scores while allowing the recorded basis of each item, so the two can't be read as contradicting.
  status: resolved
  chosen: Amend SYS-40 to name the exception
  words: |-
    Alex Thiele (summary): didn't remember SYS-40 and asked the agent to follow their intent. The agent chose to amend it, so future agents don't read the recorded basis as a stored importance score.
  resolved: '2026-10-21'
friction:
- workaround: Adding DIFF to the CLI element's depends_on asked for acknowledgments on 25 decision records about CLI (DR-1, DR-2, DR-19, DR-34 to DR-39, DR-51 to DR-53 and more) plus the AGENT and ONBOARD elements. None can be affected by the CLI gaining a dependency, so I wrote the same 'unaffected by a new dependency' note for each.
  proposal: Treat adding to an element's depends_on as not changing the meaning of the decision records about it or of the elements that depend on it; ask only when a dependency is removed or the element's purpose changes.
- workaround: Revising items I had added earlier in this same change (SYS-44, DR-54 to DR-61, CLI-22 and others) asked for acknowledgments as alterations to the engineer's words and decisions, and now lists them among the alterations awaiting the engineer's answer (35 in total, about 20 of them items new in this round). I acknowledged each one with the same note.
  proposal: |-
    Don't count an edit to an item added in the open change as an alteration: compare with the item as it was when the change opened, so the engineer sees one entry per item, the item's final text.
- workaround: A 57-operation dry run of spec edit took over two minutes, against 2.3 seconds for spec check on the same spec, so I ran it in the background.
  proposal: Profile spec edit's per-operation context and validation; it looks like the checker or the ancestor walk runs once per operation. Compute the context once per batch and validate the result once.
