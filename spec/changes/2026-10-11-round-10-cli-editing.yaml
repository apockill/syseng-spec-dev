- id: D1
  question: Which slice comes next?
  importance: It sets the order of the next stretch of work. Everything else in this change is reversible.
  involves:
  - AGENT-12
  - AGENT-20
  - CHECK-3
  - CHECK-4
  options:
  - label: The skill and the Claude Code adapter
    recommended: true
    detail: |-
      Writes SKILL.md, the method as instructions any harness can read, plus the Claude Code hooks: run the checker when an agent finishes (AGENT-12) and refuse direct spec edits (AGENT-20). After it, any new session follows the method without me in the loop, and you can start using it on real work.
  - label: Language adapters and the verification runner
    detail: pytest and GoogleTest discovery, checks for unlinked tests and links to missing ones (CHECK-3, CHECK-4), and running verification items. Closes the "every test is linked" guarantee first.
  - label: The review page
    detail: A web page with the colors, hover text and approve buttons. Nicest to read, least urgent.
  status: resolved
  chosen: The skill and the Claude Code adapter
  words: |-
    [verbatim words removed when this spec moved to intent records]
  resolved: '2026-10-11'
friction:
- workaround: Wrapped commands in `nix develop -c bash -c '...'`; an apostrophe in the YAML broke the outer quotes.
  proposal: Send heredocs straight to `nix develop -c spec edit`, or use direnv so `spec` is on PATH. The skill's examples should use that form.
- workaround: Rejected edits pointed at the scratch copy's temporary path, not the real file.
  proposal: |-
    Fixed in this change: findings are mapped back to the real files.
- workaround: Changing only a rationale or a test link demanded acknowledgments for every dependent.
  proposal: |-
    Fixed in this change: acknowledgments are needed only when an item's meaning changes (DR-35).
- workaround: A test-link change showed up as an empty diff in the context and the change log.
  proposal: |-
    Fixed in this change: every changed field is logged (DR-37).
- workaround: Adding long items echoed every field in full, costing tokens for text the change record already keeps.
  proposal: |-
    Fixed in this change: additions echo one short line per field.
- workaround: Nix prints a 'Git tree is dirty' warning on every command.
  proposal: Use `--no-warn-dirty`, or set warn-dirty = false in nix.conf. The skill's examples should include it.
- workaround: A heredoc example ending in EOF, inside my own EOF heredoc, ended the outer one early; the rest ran as stray shell commands (all harmless here).
  proposal: Examples in the skill and README use a distinctive delimiter (<<'YAML') for spec batches. Done for the README.
closed: '2026-10-11'
