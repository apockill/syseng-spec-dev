  before:
    title: Evals keep neutral cases, with promptfoo as a replaceable runner on the host
    decision: Cases stay in the Agent Skills evals.json format, checks in plain Python, and the fixture in a script. promptfoo is one adapter under evals/runners and one reader. Runs happen on the host with limited tools, not in a container, with dependencies in a flake shell.
    alternatives: Harbor, which is strong on isolation and agent coverage but built for benchmarks and needs containers. Writing our own runner, which the engineer ruled out as risky.
    consequences: An allowed command can still reach outside the workspace, which is acceptable for this repository's own skill. Hermes isn't covered. A case passes at 80% of its runs.
  after:
    title: The toolkit reads eval results, and this repository's own evals use promptfoo directly on the host
    decision: |-
      The toolkit runs nothing: evaluations reach it through a reader, as other test results do. This repository's evals of its own skill are a plain promptfoo config, with checks in Python and a script that builds the fixture. They run on the host with limited tools, not in a container, with dependencies in a flake shell.
    alternatives: Harbor, which is strong on isolation and agent coverage but built for benchmarks and needs containers. Neutral cases translated into each runner's config, which was built and removed as abstraction for a second runner that doesn't exist. Writing our own runner, which the engineer ruled out as risky.
    consequences: An allowed command can still reach outside the workspace, which is acceptable for this repository's own skill. Hermes isn't covered. A case passes at 80% of its runs. Changing eval tool means converting the cases and adding a reader, which is simple YAML work.
  acks:
    DR-77: the engineer agreed to this
