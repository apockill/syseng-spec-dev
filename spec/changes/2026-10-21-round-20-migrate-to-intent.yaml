- op: modify
  id: DR-48
  at: 2026-10-21T13:29-07:00
  reason: |-
    round 20 migration: basis for an agent's decision; vocabulary (approval to lock)
  before:
    title: Alterations to the engineer's items are flagged when logged, and answered by approval or rollback
    context: SYS-37 asks that each alteration to what the engineer approved, wrote or decided be raised after the work is built and tested, and the engineer described rolling back what they care about.
    decision: When an edit changes the meaning of such an item, the change log records why it counts (approved, their words, their decision) and the item's fingerprints before and after. Before applying it, the CLI asks the agent to acknowledge it. The alteration stays listed in the change record, and as a to-do, until the engineer approves the item as it now is (kept), or it's back to its earlier content (rolled back). A removed item is listed but can't be kept by approval.
  after:
    title: Alterations to the engineer's items are flagged when logged, and answered by a lock or rollback
    context: SYS-37 asks that each alteration to what the engineer locked, wrote or decided be raised after the work is built and tested, and the engineer described rolling back what they care about.
    decision: When an edit changes the meaning of such an item, the change log records why it counts (locked, their words, their decision) and the item's fingerprints before and after. Before applying it, the CLI asks the agent to acknowledge it. The alteration stays listed in the change record, and as a to-do, until the engineer locks the item as it now is (kept), or it's back to its earlier content (rolled back). A removed item is listed but can't be kept by a lock.
    basis: derived
