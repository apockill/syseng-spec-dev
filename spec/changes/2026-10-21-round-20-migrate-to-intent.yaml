- id: D1
  kind: conflict
  question: The move to levels and locks changes the meaning of ten items you locked, stated or guided. Keep the new text?
  importance: These are your own needs and decisions, and each described the old approval model (approve everything, unreviewed items, approved specs), which you replaced in round 18. Rewording the vocabulary alone would have made them say something you didn't mean, so each was rewritten to what round 18 decided. Everything else in the migration kept its meaning.
