  options:
  - label: Keep all ten as rewritten
    recommended: true
    detail: |-
      NEED-10 (onboarding): you confirm the needs in one go, and everything beneath them follows from them, instead of approving the rest.
      NEED-15: you need to tell which items a person locked or stated, and which an agent decided beneath them.
      SYS-14: the toolkit shows you each item that changed since a person locked, stated or guided it, instead of every unapproved item.
      CHANGE-1, AGENT-10, AGENT-11 (spec-first): you review the spec before building, instead of approving it; agents build the spec as agreed and report differences from it.
      CLI-13: the CLI shows an item's level of intent and intent records, instead of its review state and your words.
      MODEL-14 (each requirement records its origin): retired, because the level of intent replaces origin; its two intent records moved to MODEL-38.
      DR-31 and DR-47: status notes saying DR-54 amended them (a missing lock isn't a to-do; a derived item names the nearest item a person gave).
  - label: Keep some, roll back the rest
    detail: Name the ones to roll back. Each goes back to its earlier text, still using the old vocabulary, and stays flagged as describing the old model.
  - label: Roll back all ten
    detail: They keep their earlier text as history of the old model. The spec then contradicts itself where they meet round 18's items, and the checker can't tell which side holds.
