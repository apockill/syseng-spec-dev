- op: add
  id: DR-63
  at: 2026-10-21T13:36-07:00
  reason: records how the migration works.
  after:
    title: |-
      Migration is two steps: agents summarize what needs judgment, then one command does the rest
    decided_by: agent
    basis: derived
    elements:
    - CLI
    - MODEL
    - CHECK
    requirements: CLI-28, CHECK-27, SYS-35
    recorded: round 20
    context: Round 18 (D1) asked for a complete move to the new model, with nothing verbatim left in current files. Summarizing a person's words needs judgment; moving locks, cleaning change records and marking the format don't. Other repositories set up with the toolkit will need the same move.
    decision: |-
      - Agents first convert each item through `spec edit`: a person's words become intent records, an agent's items get a basis, and the older fields are unset. Rewordings of the vocabulary are declared as rewordings.
      - Then `spec migrate`, in the same open change, refuses while any older field remains; carries each lock over an item the change only reworded, keeping the old fingerprint as `migrated_from`, as DR-29 did; moves approvals.yaml to locks.yaml in the lock schema without words, filling in the person running it where a record named no one and noting so; replaces verbatim values in change records with a marker, keeping values written as summaries; removes hand-written change records from before records were YAML (DR-65); and sets spec_version 2, enforcing flow-down when nothing violates it.
      - It runs once. After it, the checker reports any older field as an error.
    alternatives: A migration script outside the toolkit, as round 9 used, which other repositories couldn't reuse. Asking the engineer to re-lock every reworded item, which DR-29 already chose against.
    consequences: Carrying locks over rewordings is possible only during this one migration, so an agent can't use it to keep a lock across a later edit. Records from before round 12 name the person who ran the migration, with a note, because no approver was recorded then.
- op: add
  id: DR-64
  at: 2026-10-21T13:36-07:00
  reason: the engineer's nudge toward structured, validated metadata.
  after:
    title: Intent records and locks are validated against pydantic schemas
    decided_by: agent
    elements:
    - MODEL
    - CHECK
    - CLI
    requirements: MODEL-34, MODEL-36, MODEL-37, CHECK-20
    recorded: round 20
    context: The engineer's words had lived in free text, and intent records and locks were checked field by field in hand-written code. The engineer suggested schemas.
    decision: |-
      - Intent records (a draft as an agent writes it, and the stored record) and locks are pydantic models with fixed fields and no others.
      - Formats are validated: a person is `Name <email>`, a statement's time is a date with the time when known, a lock's time is an ISO date and time, a fingerprint is twelve hex characters, the basis and the channel come from fixed lists.
      - The checker turns each validation error into a finding (A006, A010), so a malformed record is reported with everything else in one run; `spec edit` refuses a malformed draft before writing.
      - Items themselves stay plain mappings for now; moving every kind of item to a schema is a larger change for a later round.
    alternatives: Hand-written field checks, which drift from the format and don't check values. JSON Schema, which needs a second file to keep in step with the code.
    consequences: The toolkit depends on pydantic as well as PyYAML. Free-text summaries inside other fields are no longer an accepted way to record a person's words.
    intent:
    - by: Alex Thiele <alex.g.thiele@gmail.com>
      when: '2026-10-21'
      context: Reviewing a transitional source field written in round 18, in which the author, date and summary sat in one free-text string, while round 20's migration was under way.
      said: Suggested using pydantic to enforce the metadata and validate it, and found one free-text field carrying a summary, author and date brittle; it should be several metadata fields. Left the implementation to the agent, wanting only to nudge it toward best practice.
      basis: guided
      fingerprint: 844ef68db123
