[project]
name = "syseng"
version = "0.1.0"
description = "A systems-engineering spec toolkit: needs, requirements, verification and decisions, kept honest by a CLI."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "pydantic>=2.6"]

[project.scripts]
spec = "syseng.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syseng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
