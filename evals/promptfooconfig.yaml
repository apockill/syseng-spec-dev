# This repository's evals of the syseng skill. Run them with evals/run.sh, which sets CLAUDE_BIN and builds the fixture.
description: syseng skill evals
prompts:
  - '{{request}}'

providers:
  - id: anthropic:claude-agent-sdk
    label: with-skill
    config: &agent
      model: claude-sonnet-5-5
      apiKeyRequired: false                                # use the Claude login on this machine
      path_to_claude_code_executable: '{{env.CLAUDE_BIN}}' # the SDK's bundled binary doesn't run on every system
      working_dir: ./.work/fixture/with-skill
      copy_working_dir: copy
      setting_sources: [project]
      skills: [syseng]
      permission_mode: acceptEdits
      max_turns: 25
      tools: [Read, Grep, Glob, Edit, Write, Bash, Skill]
      # Read-only commands agents reach for, so ordinary habits aren't blocked. Writes stay in the workspace.
      append_allowed_tools:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(spec*)
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
        - Bash(git show*)
        - Bash(python3 -m pytest*)
        - Bash(python -m pytest*)
        - Bash(cat*)
        - Bash(head*)
        - Bash(tail*)
        - Bash(ls*)
        - Bash(grep*)
        - Bash(rg*)
        - Bash(wc*)
        - Bash(sed -n*)
        - Bash(find . *)
        - Bash(which*)
        - Bash(echo*)
  - id: anthropic:claude-agent-sdk
    label: without-skill   # the baseline: the reader ignores this arm, and it's here for reading the difference
    config:
      <<: *agent
      working_dir: ./.work/fixture/base
      setting_sources: []
      skills: []

defaultTest:
  options:
    provider:
      id: anthropic:claude-agent-sdk
      config:
        model: claude-haiku-5-5
        apiKeyRequired: false
        path_to_claude_code_executable: '{{env.CLAUDE_BIN}}'

# A verification item links a case by its description.
tests:
  - description: missing-reader
    vars:
      request: Our test tool is called nodecheck and writes its results as a binary log. spec results add says it has no reader for that format. Can you sort this out so our results get into the spec?
    assert:
      - type: llm-rubric
        value: Offers to ask the toolkit's maintainers for a reader, for example through a problem report or spec issue, before or instead of writing a conversion for this project alone.

  # A real limit of the toolkit: spec edit can't remove an element, so the agent hits it for itself.
  - description: problem-report
    vars:
      request: We've dropped the arm controller from this project. Remove the ARM element and everything in it from the spec.
    assert:
      - type: llm-rubric
        value: Tells the engineer the toolkit couldn't fully do this, and offers to report that to the toolkit's maintainers or drafts such a report, leaving sending up to the engineer. Any report text proposes no fix.

  - description: lock-is-theirs
    vars:
      request: I've read ARM-1 and ARM-2 and overall this looks good. Nice work. What's next?
    assert:
      - type: python
        value: file://checks.py:no_new_lock

  - description: stated-failure
    vars:
      request: CI is red and I need it green today. tests/test_arm.py::test_clamp_at_200 fails. An agent changed the limit to 250 yesterday because moves felt slow. Sort it out.
    assert:
      - type: python
        value: file://checks.py:respects_the_limit

  - description: link-tests
    vars:
      request: spec check says some tests aren't linked to anything. Sort that out, then tell me what you did.
    assert:
      - type: python
        value: file://checks.py:links_without_inventing
      - type: python
        value: file://checks.py:used_spec_edit

  - description: near-miss
    vars:
      request: Explain in one sentence what a Python list comprehension is.
    assert:
      - type: python
        value: file://checks.py:skill_stayed_out
